","start":1151.02,"end":1152.94,"viStart":1151.02,"viEnd":1152.94,"koStart":1151.02,"koEnd":1152.94,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":127,"sourceUid":"ko-mrc6q93n-1257","sourceNo":301,"vi":"[Tiếng đóng cửa]","ko":"[문 닫히는 소리]","en":"[Sound of door closing]","start":1154.61,"end":1156.11,"viStart":1154.61,"viEnd":1156.11,"koStart":1154.61,"koEnd":1156.11,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":128,"sourceUid":"merged-mrd83b41-93","sourceNo":305,"vi":"Yong Ho.\nVâng, thưa bố.\nLo lắng có khiến vấn đề mất đi không?\nLà chủ tịch thì đừng có lo.\nCon phải khiến người khác lo chứ.\nĐem xả hết nỗi lo của con cho đám nô bộc ăn lương đi.","ko":"용호야\n예, 아버님\n걱정을 한다고 걱정이 사라지니?\n[근철] 회장이 와 걱정을 하니\n걱정을 하게 만들어야디\n니 걱정 월급 받는 머슴들한테 싹 다 줘 버려라","en":"Yong Ho.\nYong-ho.\nYes, Father.\nWorrying doesn't make the problem go away.\nA chairman shouldn't worry.\nYou should make people worry.\nGive all your worries to the servants that you pay for.","start":1125.555104,"end":1148.817629,"viStart":1125.41979,"viEnd":1148.605822,"koStart":1125.555104,"koEnd":1148.817629,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1125.41979,"end":1148.605822},"koRange":{"start":1125.555104,"end":1148.817629}},{"id":129,"sourceUid":"merged-mrd85iac-95","sourceNo":308,"vi":"Vâng. Bố dùng bữa đi ạ.","ko":"네, 식사하셔야죠","en":"Yes, Father. You should eat.","start":1148.817629,"end":1151.717232,"viStart":1148.605822,"viEnd":1151.864035,"koStart":1148.817629,"koEnd":1151.717232,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1148.605822,"end":1151.864035},"koRange":{"start":1148.817629,"end":1151.717232}},{"id":130,"sourceUid":"ko-mrc6q93n-1265","sourceNo":309,"vi":"[Tiếng đóng cửa]","ko":"[문 닫히는 소리]","en":"[Sound of door closing]","start":1174.84,"end":1175.92,"viStart":1174.84,"viEnd":1175.92,"koStart":1174.84,"koEnd":1175.92,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":131,"sourceUid":"merged-mrd877dy-97","sourceNo":312,"vi":"Hôm nay con không ăn sáng đâu ạ.\nCó ổn không đấy?\nHôm qua con uống nhiều lắm mà.\nĐối với nô lệ của tư bản, bụng đói không đáng sợ bằng muộn làm.","ko":"[은정] 노예는 아침밥 패스요\n[정숙] 괜찮겠냐? 너 어제 과음했잖아\n아, 월급 노예한테는 빈속보단 지각이 더 무섭죠","en":"No breakfast for me today. Will you be okay? You were wasted yesterday. I'm more afraid of being late to work than an empty stomach.","start":1151.717232,"end":1164.18976,"viStart":1151.864035,"viEnd":1164.593195,"koStart":1151.717232,"koEnd":1164.18976,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1151.864035,"end":1164.593195},"koRange":{"start":1151.717232,"end":1164.18976}},{"id":132,"sourceUid":"ko-mrc6q93n-1271","sourceNo":315,"vi":"[Âm nhạc thú vị]","ko":"[흥미로운 음악]","en":"[Interesting music]","start":1201.11,"end":1203.16,"viStart":1201.11,"viEnd":1203.16,"koStart":1201.11,"koEnd":1203.16,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":133,"sourceUid":"merged-mrd89xyy-99","sourceNo":317,"vi":"Đứng lại!\nĐằng sau, quay!\nMau lên!","ko":"[은정] 거기 스톱!\n뒤로 돌아\n씁! 어서","en":"Stop right there.\nTurn around.\nCome on.","start":1176,"end":1184.481088,"viStart":1176,"viEnd":1184.654095,"koStart":1176,"koEnd":1184.481088,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1176,"end":1184.654095},"koRange":{"start":1176,"end":1184.481088}},{"id":134,"sourceUid":"merged-mrd8byvc-100","sourceNo":320,"vi":"Đây là gì vậy?\nA Ji biết đọc rồi mà.\nCon đọc xem.","ko":"응? 이게 뭐야?\n아지 한글 알지?\n[은정] 읽어 봐","en":"What's this?\nYou can read, right?\nRead it.","start":1199,"end":1204.398639,"viStart":1199,"viEnd":1204.994835,"koStart":1199,"koEnd":1204.398639,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1199,"end":1204.994835},"koRange":{"start":1199,"end":1204.398639}},{"id":135,"sourceUid":"merged-mrd8fce9-102","sourceNo":329,"vi":"\"Chuyên viên Cho Eun Jeong\nxin phép từ chức\nvì lý do cá nhân.\"\n\"Đơn xin thôi việc\"?\nMẹ không còn là nô lệ của đồng lương nữa.\nMẹ sẽ nghỉ việc.\n- Thật sao? - Ừ!\n- Thật á? - Ừ!\nMẹ con thất nghiệp rồi!","ko":"'조은정 차장은'\n[아지] '일신상의 사정으로 인하여'\n- [흥미로운 음악] - '사직을 신청합니다'\n'사직서'?\n엄마 월급 노예 아니다?\n회사 그만둘 거야\n- [놀라며] 진짜? - [은정] 응\n- 정말? - [은정] 어\n우리 엄마 백수다!","en":"\"Deputy Manager Cho Eun-jeong\nrequests that she resigns from her position\ndue to personal reasons.\"\n\"Resignation letter\"?\nI'm not going to go to work anymore.\nI'm going to quit.\n-Really? -Yes!\n-Seriously? -Yes!\nMy mom's unemployed!","start":1204.398639,"end":1225.625953,"viStart":1204.994835,"viEnd":1226.470337,"koStart":1204.398639,"koEnd":1225.625953,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1204.994835,"end":1226.470337},"koRange":{"start":1204.398639,"end":1225.625953}},{"id":136,"sourceUid":"merged-mrd8gpla-103","sourceNo":333,"vi":"Cuối cùng mẹ cũng ở nhà rồi!\nPhải khoe với các bạn mới được. Vui quá đi!\nNày.\nCon sẽ không sao chứ?","ko":"[아지] 이제 집에 있는다!\n애들한테 자랑해야겠다\n신난다!\n[정숙] 야, 너 괜찮겠냐?","en":"She's finally going to be home!\nI'm going to tell my friends. I love it!\nHey.\nWill you be okay?","start":1225.625953,"end":1234.955663,"viStart":1226.470337,"viEnd":1235.618015,"koStart":1225.625953,"koEnd":1234.955663,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1226.470337,"end":1235.618015},"koRange":{"start":1225.625953,"end":1234.955663}},{"id":137,"sourceUid":"merged-mrd8o1h1-104","sourceNo":297,"vi":"Thôi thì tạm thời, con sẽ làm tự do.\nKhi nào A Ji bắt đầu đi học\nthì con sẽ đi làm lại.","ko":"아, 뭐, 프리랜서 카피 하다가\n아지 학교 입학하면 그때 다시 회사 가든지 해야죠","en":"Well, I'll be a freelance copywriter for the time being.\nAnd when A-ji goes to school,\nI'll get another job.","start":1234.955663,"end":1243.076184,"viStart":1235.618015,"viEnd":1243.567814,"koStart":1234.955663,"koEnd":1243.076184,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1235.618015,"end":1243.567814},"koRange":{"start":1234.955663,"end":1243.076184}},{"id":138,"sourceUid":"merged-mrd8pqhy-106","sourceNo":341,"vi":"Được vậy thì tốt thật.\nMẹ sẽ ở nhà chơi với mình.\nLúc nào mẹ cũng ở nhà!\nA Ji, bình tĩnh lại đi con.\nCon không bình tĩnh được.\nCon thích quá!\nVui quá đi!","ko":"쯧, 그러면야 좋지만\n- [아지] 우리 엄마 집에서 논다 - [잔잔한 음악]\n계속 놀 거다!\n아지야, 진정해\n진정이 안 돼, 너무 좋아\n신난다!","en":"That's easier said than done.\nMy mom will hang around at home.\nShe's always going to be home!\nA-ji, calm down.\nBut I can't.\nI'm thrilled!\nI'm so happy!","start":1243.076184,"end":1256.343486,"viStart":1243.567814,"viEnd":1256.914909,"koStart":1243.076184,"koEnd":1256.343486,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1243.567814,"end":1256.914909},"koRange":{"start":1243.076184,"end":1256.343486}},{"id":139,"sourceUid":"merged-mrd8qkrx-107","sourceNo":344,"vi":"[Âm thanh vận hành khóa cửa]\n[Tiếng đóng cửa]\n- [Thở dài] - [Âm thanh vận hành khóa cửa]","ko":"[도어 록 작동음]\n[문 닫히는 소리]\n- [한숨] - [도어 록 작동음]","en":"[Door lock operating sound]\n[Sound of door closing]\n- [Sigh] - [Door lock operating sound]","start":1285.07,"end":1286.99,"viStart":1285.07,"viEnd":1286.99,"koStart":1285.07,"koEnd":1286.99,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":141,"sourceUid":"merged-mrd8r0lh-109","sourceNo":346,"vi":"Cái số mình đúng là bạc bẽo.","ko":"팔자 참 기구하다, 기구해","en":"My life is so unfortunate.","start":1269,"end":1273.797823,"viStart":1269,"viEnd":1273.415589,"koStart":1269,"koEnd":1273.797823,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1269,"end":1273.415589},"koRange":{"start":1269,"end":1273.797823}},{"id":143,"sourceUid":"merged-mrd8spok-110","sourceNo":350,"vi":"Cái tên này…\nAnh phải nói sớm chứ.\nAi ép anh cản Giám đốc Go đâu?","ko":"[차 부장] 야, 이씨\n미리 말은 해 줬어야지, 쯧\n[은 부장] 누가 부장님한테 고 상무 막으래요?","en":"You… You should have told us. Did we ask you to stop Director Go?","start":1288,"end":1294.719274,"viStart":1288,"viEnd":1294.968344,"koStart":1288,"koEnd":1294.719274,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1288,"end":1294.968344},"koRange":{"start":1288,"end":1294.719274}},{"id":144,"sourceUid":"merged-mrd8wp1q-112","sourceNo":352,"vi":"Anh tưởng chúng tôi sẽ để yên à?\nNói thẳng ra thì chúng tôi chỉ cần cầm cự sáu tháng thôi.","ko":"[차 부장] 우리가 이대로 가만히 있을 거 같아?\n[은 부장] 막말로 6개월만 버티면 끝 아니에요?","en":"You think we won't fight back?\nHonestly, we just need to hold out for six months.","start":1294.719274,"end":1300.530068,"viStart":1294.968344,"viEnd":1300.8,"koStart":1294.719274,"koEnd":1300.530068,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1294.968344,"end":1300.8},"koRange":{"start":1294.719274,"end":1300.530068}},{"id":145,"sourceUid":"merged-mrd8yees-113","sourceNo":354,"vi":"Này, phải hất cẳng cô ta ra sớm hơn.\nAnh tưởng bọn tôi không có cách à?","ko":"[차 부장] 에이 그 전에 밀어내야지 방법 없을 줄 알아?","en":"Come on, we're going to bring her down earlier.\nDo you think we have no way to fight her?","start":1300.530068,"end":1305.7,"viStart":1300.8,"viEnd":1306.1,"koStart":1300.530068,"koEnd":1305.7,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1300.8,"end":1306.1},"koRange":{"start":1300.530068,"end":1305.7}},{"id":146,"sourceUid":"merged-mrd907bp-114","sourceNo":355,"vi":"Khoan đã.\nMọi người nói sáu tháng là sao?","ko":"잠깐만요, 6개월이라니 무슨 말씀이세요?","en":"Hold on.\nWhat do you mean six months?","start":1305.7,"end":1308.500317,"viStart":1306.1,"viEnd":1308.465942,"koStart":1305.7,"koEnd":1308.500317,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1306.1,"end":1308.465942},"koRange":{"start":1305.7,"end":1308.500317}},{"id":147,"sourceUid":"ko-mrc6q93n-1312","sourceNo":356,"vi":"[âm nhạc đen tối]","ko":"[어두운 음악]","en":"[dark music]","start":1331.37,"end":1333.33,"viStart":1331.37,"viEnd":1333.33,"koStart":1331.37,"koEnd":1333.33,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":148,"sourceUid":"merged-mrd926dm-116","sourceNo":358,"vi":"Cô bảo nếu không thể tăng doanh thu trong sáu tháng thì sẽ từ chức sao?\nỪ.","ko":"[병수] 6개월 내로 매출 50% 못 올리면\n사표 쓰겠다고 하셨다면서요\n[아인] 응","en":"Is it true that you'll resign if you don't :427,"vi":"Chào anh. Quảng cáo lần này nhận được phản ứng rất tốt. Tôi đang bận họp. Liên lạc với cô sau nhé.","ko":"안녕하세요 이번 광고 반응 괜찮던데 [광고주2] 아, 제가 회의 중이라서 - 다시 연락드릴게요 - [통화 종료음]","en":"Hello. I heard the ad was received well. I'll call you again later. I'm in a meeting.","start":1498,"end":1505.946175,"viStart":1498,"viEnd":1505.507302,"koStart":1498,"koEnd":1505.946175,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1498,"end":1505.507302},"koRange":{"start":1498,"end":1505.946175}},{"id":183,"sourceUid":"merged-mrdawxxl-153","sourceNo":428,"vi":"Cứ như họ cố tình né tránh mình.","ko":"뭐지? 의도적으로 피하는 거 같은데","en":"What's happening?\nThey seem to be avoiding me.","start":1510,"end":1515.790476,"viStart":1510,"viEnd":1517.678912,"koStart":1510,"koEnd":1515.790476,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1510,"end":1517.678912},"koRange":{"start":1510,"end":1515.790476}},{"id":185,"sourceUid":"ko-mrc6q93o-1387","sourceNo":431,"vi":"[âm thanh rung của điện thoại di động]","ko":"[휴대전화 진동음]","en":"[cell phone vibrating sound]","start":1542.16,"end":1544,"viStart":1542.16,"viEnd":1544,"koStart":1542.16,"koEnd":1544,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":186,"sourceUid":"merged-mrdbajn6-155","sourceNo":433,"vi":"Vâng, Giám đốc. Cô đang định gọi tôi đúng không?","ko":"[아인] 네, 대표님\n[재훈] 지금 저한테 전화하려고 하셨죠?","en":"Hello, Mr. Jung.\nYou were about to call me, weren't you?","start":1525,"end":1529.843121,"viStart":1525.428568,"viEnd":1529.650794,"koStart":1525,"koEnd":1529.843121,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1525.428568,"end":1529.650794},"koRange":{"start":1525,"end":1529.843121}},{"id":188,"sourceUid":"merged-mrdbe3ro-159","sourceNo":437,"vi":"Lần này để cô dễ bộc lộ yêu ghét, tôi đã chọn một chỗ rẻ.\nNơi này có vẻ khá lâu đời.\nĐây là nhà ăn của công ty tôi\nkhi mới được thành lập.","ko":"[재훈] 이번엔 호불호 드러내기 쉬우시라고\n싼 데로 왔습니다\n[아인] 오래된 집인가 보네요\n제가 회사 처음 시작했을 때\n여기가 구내식당이었죠","en":"I chose a cheaper place this time, so feel free to express your feelings.\nIt's quite old.\nThis was my company's cafeteria\nwhen I started the company.","start":1535,"end":1546.976528,"viStart":1535,"viEnd":1547.291509,"koStart":1535,"koEnd":1546.976528,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1535,"end":1547.291509},"koRange":{"start":1535,"end":1546.976528}},{"id":189,"sourceUid":"merged-mrdbekd3-160","sourceNo":440,"vi":"Ôi chao, tôi sắp quên mặt cậu đến nơi rồi.\nCháu đến để bác không quên đây.","ko":"[주인] 아이고, 얼굴 까먹겠어\n까먹지 말라고 왔잖아요","en":"Gosh, it's been so long. I'm going to forget your face.\nI came so you wouldn't.","start":1550,"end":1555.225435,"viStart":1550,"viEnd":1555.725931,"koStart":1550,"koEnd":1555.225435,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1550,"end":1555.725931},"koRange":{"start":1550,"end":1555.225435}},{"id":190,"sourceUid":"merged-mrdbflnq-161","sourceNo":442,"vi":"Bạn gái à?\nKhông ạ.","ko":"여자 친구?\n아니요","en":"Your girlfriend?\nNo.","start":1555.225435,"end":1558.606841,"viStart":1555.225435,"viEnd":1558.606841,"koStart":1555.225435,"koEnd":1558.606841,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":1555.225435,"end":1558.606841}},{"id":191,"sourceUid":"merged-mrdbh9sr-163","sourceNo":445,"vi":"- May quá. - May chỗ nào ạ?\nCon bé trông gầy gò và xinh đẹp đấy,\nnhưng đôi mắt đầy tham vọng lắm.\nKhông phải tướng phụ nữ giỏi chăm lo gia đình.","ko":"[주인] 다행이네\n[재훈] 뭐가요?\n[주인] 얄쌍하니 새초롬한 게 예쁘긴 헌데\n눈두덩에 욕심이 그득한 게 애 낳고 살림할 관상은 아니여","en":"-That's a relief. -What do you mean?\nShe may look slim and pretty,\nbut I can see the greed in her eyes.\nShe doesn't seem like the type to start a family.","start":1558.606841,"end":1569.966121,"viStart":1555.725931,"viEnd":1570.351624,"koStart":1558.606841,"koEnd":1569.966121,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1555.725931,"end":1570.351624},"koRange":{"start":1558.606841,"end":1569.966121}},{"id":192,"sourceUid":"merged-mrdbiezv-165","sourceNo":400,"vi":"Bác xem chuẩn đấy.\nĐể cháu gửi tiền xem tướng.\nCô có đôi mắt sợ sệt như thỏ\nmà lại sống như sư tử nên mới khổ đấy.","ko":"잘 보시네요, 복채 드려야겠어요\n아, 겁먹은 토끼 눈 가지고 사자처럼 살려니까 힘이 들지","en":"Right on the money.\nAre you a fortune teller?\nIt's hard to live as a lion\nwhen you have the eyes of a rabbit.","start":1569.966121,"end":1576.966952,"viStart":1570.351624,"viEnd":1577.169583,"koStart":1569.966121,"koEnd":1576.966952,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1570.351624,"end":1577.169583},"koRange":{"start":1569.966121,"end":1576.966952}},{"id":193,"sourceUid":"merged-mrdbj07v-166","sourceNo":450,"vi":"Ôi chao, xem cái vòng eo kìa.\nKết bạn với con kiến cũng được.","ko":"- [차분한 음악] - [주인] 아이고, 허리 하고는\n개미가 '언니' 하게 생겼어","en":"Gosh, look how skinny you are.\nYou've got that wasp waist.","start":1576.966952,"end":1582.406226,"viStart":1577.169583,"viEnd":1582.370467,"koStart":1576.966952,"koEnd":1582.406226,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1577.169583,"end":1582.370467},"koRange":{"start":1576.966952,"end":1582.406226}},{"id":194,"sourceUid":"merged-mrdbjvay-167","sourceNo":453,"vi":"Ăn nhiều vào.\nBọn cháu sẽ ăn nhiều.\nCậu thì ăn vừa thôi!","ko":"아, 밥 좀 많이 먹어\n아유, 많이 먹을게요\n[주인] 에이그, 넌 작작 먹고","en":"You should eat more.\nWe will indeed.\nYou should be eating less!","start":1582.406226,"end":1587.595886,"viStart":1582.370467,"viEnd":1587.649696,"koStart":1582.406226,"koEnd":1587.595886,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1582.370467,"end":1587.649696},"koRange":{"start":1582.406226,"end":1587.595886}},{"id":195,"sourceUid":"merged-mrdbkts6-168","sourceNo":457,"vi":"Bác ấy hơi nặng lời nhỉ.\nNhưng cô ăn đi.\nĐồ ăn thì ngon lắm.\nNhưng mà…\nsao tự dưng anh lại hẹn gặp tôi?","ko":"조금 사나우세요\n[재훈] 드셔 보세요 음식 맛은 안 사나우니까\n[아인] 근데\n갑자기 절 보자고 하신 이유가…","en":"She's a bit blunt.\nBut the food is great.\nGo ahead and eat.\nBut…\nwhy did you ask me to meet you?","start":1587.595886,"end":1601.383969,"viStart":1587.649696,"viEnd":160 duce\nyour investment in marketing this year.","start":1623.539265,"end":1634.600671,"viStart":1623.639239,"viEnd":1634.757005,"koStart":1623.539265,"koEnd":1634.600671,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1623.639239,"end":1634.757005},"koRange":{"start":1623.539265,"end":1634.600671}},{"id":200,"sourceUid":"merged-mrdbr1za-177","sourceNo":476,"vi":"Thế nên tôi gọi cho cô ngay lập tức.\nTôi nghĩ đã xảy ra chuyện gì đó.\nTôi xin lỗi\nvì để chuyện nội bộ làm phiền đến anh.\nTôi lại mừng đấy.","ko":"[재훈] 그래서 바로 상무님한테 전화드렸죠\n뭔 일 있구나 싶어서\n죄송합니다\n회사 내부 일로 귀찮게 해 드려서\n저야 좋죠","en":"So I called you as soon as he left.\nI thought something was up.\nMy apologies\nfor bothering you with our company issues.\nI'm actually glad.","start":1634.600671,"end":1652.597319,"viStart":1634.757005,"viEnd":1652.866431,"koStart":1634.600671,"koEnd":1652.597319,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1634.757005,"end":1652.866431},"koRange":{"start":1634.600671,"end":1652.597319}},{"id":201,"sourceUid":"merged-mrdbrvoi-178","sourceNo":477,"vi":"Vì nhờ có chuyện đó mà tôi mới được dùng bữa cùng cô.","ko":"아, 그 덕에 상무님이랑 같이 밥도 먹고","en":"Thanks to that, I get to have a meal with you.","start":1652.597319,"end":1657.418378,"viStart":1652.866431,"viEnd":1657.603318,"koStart":1652.597319,"koEnd":1657.418378,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1652.866431,"end":1657.603318},"koRange":{"start":1652.597319,"end":1657.418378}},{"id":202,"sourceUid":"merged-mrdbsea2-179","sourceNo":479,"vi":"Vậy anh đã làm thế nào?\nTôi nghe nói người trong ngành của cô coi khách hàng như thượng đế.","ko":"근데 어떻게 아셨어요?\n그쪽에선 광고주를 광고주님, 신이라고 부른다면서요","en":"So what did you do?\nI heard the people in your field refer to your clients as gods.","start":1657.418378,"end":1666.48577,"viStart":1657.603318,"viEnd":1665.687815,"koStart":1657.418378,"koEnd":1666.48577,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1657.603318,"end":1665.687815},"koRange":{"start":1657.41837 function loadVolSettings(){try{return JSON.parse(localStorage.getItem(VOL_KEY)||'{}')||{}}catch(e){return {}}}
function saveVolSettings(){try{localStorage.setItem(VOL_KEY,JSON.stringify({vi:clampVol($('viVol')?.value||100),ko:clampVol($('koVol')?.value||100)}))}catch(e){}}
function volValue(lang){return clampVol($(lang+'Vol')?.value||100)}
function ensureVolGain(lang){
  try{
    const a=audioEl(lang);
    if(!volCtx)volCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(!volSources[lang]){
      volSources[lang]=volCtx.createMediaElementSource(a);
      volGains[lang]=volCtx.createGain();
      volSources[lang].connect(volGains[lang]);
      volGains[lang].connect(volCtx.destination);
    }
    if(volCtx.state==='suspended')volCtx.resume().catch(()=>{});
    return true;
  }catch(e){return false}
}
function applyGameVolume(lang){
  if(lang!=='vi'&&lang!=='ko')return;
  const v=volValue(lang), a=audioEl(lang), label=$(lang+'VolLabel');
  if(label)label.textContent=Math.round(v)+'%';
  const ok=ensureVolGain(lang);
  if(ok&&volGains[lang]){a.volume=1;volGains[lang].gain.value=v/100}
  else a.volume=Math.min(1,v/100);
}
function setGameVolume(lang,v,persist=true){
  const slider=$(lang+'Vol');if(slider)slider.value=String(clampVol(v));
  applyGameVolume(lang);
  if(persist)saveVolSettings();
}
function initVolumeControls(){
  const saved=loadVolSettings();
  ['vi','ko'].forEach(lang=>{
    const slider=$(lang+'Vol');
    const val=clampVol(saved[lang]??100);
    if(slider){
      slider.value=String(val);
      slider.oninput=()=>setGameVolume(lang,slider.value,true);
      slider.onchange=()=>setGameVolume(lang,slider.value,true);
    }
    setGameVolume(lang,val,false);
  });
}
function validRange(s,e){s=Number(s);e=Number(e);return Number.isFinite(s)&&Number.isFinite(e)&&e>=s}
function audioRange(item,side){
  if(!item)return {lang:'readko',start:0,end:0,label:'Read KO'};
  const lang=item[side+'Lang'];
  const hasKo=!!item.hasKoAudio&&validRange(item.koStart,item.koEnd);
  const hasVi=!!item.hasViAudio&&validRange(item.viStart,item.viEnd);
  if(lang==='readko')return {lang:'readko',start:item.koStart,end:item.koEnd,label:'Read KO'};
  if(lang==='ko'){
    if(hasKo)return {lang:'ko',start:item.koStart,end:item.koEnd,label:'KO Live'};
    return {lang:'readko',start:item.koStart,end:item.koEnd,label:'Read KO'};
  }
  if(hasVi)return {lang:'vi',start:item.viStart,end:item.viEnd,label:'VI Dub'};
  if(hasKo)return {lang:'ko',start:item.koStart,end:item.koEnd,label:'KO Live'};
  return {lang:'readko',start:item.koStart,end:item.koEnd,label:'Read KO'};
}
function koTextForRead(s){return clean(String(s||'').replace(/[()\[\]{}<>]/g,' ').replace(/^[A-Za-z0-9_.\- ]+:\s*/gm,' ').replace(/\s{2,}/g,' '))}
function pickKoVoice(){if(!('speechSynthesis' in window))return null;const voices=speechSynthesis.getVoices()||[];return voices.find(v=>/^ko(-|_)?KR/i.test(v.lang))||voices.find(v=>/^ko/i.test(v.lang))||voices.find(v=>/korean|한국|대한/i.test(v.name||''))||null}
function stopTts(){if('speechSynthesis' in window){try{speechSynthesis.cancel()}catch(e){}}}
function stopAudio(){['vi','ko'].forEach(k=>{try{audioEl(k).pause()}catch(e){}});stopTts();clearTimeout(state.timer);state.audioMode='free';state.segmentEnd=null;state.roundEnd=null}
function readKoText(text,label){text=koTextForRead(text);if(!text)return setStatus('Cue này chưa có KO text để Read KO.');if(!('speechSynthesis' in window))return setStatus('Trình duyệt này chưa hỗ trợ Read KO.');stopAudio();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=0.88;u.pitch=1;const v=pickKoVoice();if(v)u.voice=v;u.onstart=()=>setStatus((label||'Read KO')+': đang đọc.');u.onend=()=>setStatus((label||'Read KO')+': đã đọc xong.');u.onerror=()=>setStatus((label||'Read KO')+': không đọc được.');speechSynthesis.speak(u)}
function readKoPromise(text){return new Promise(resolve=>{text=koTextForRead(text);if(!text||!('speechSynthesis' in window)){resolve();return}const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=0.88;u.pitch=1;const v=pickKoVoice();if(v)u.voice=v;u.onend=()=>resolve();u.onerror=()=>resolve();speechSynthesis.speak(u)})}
function rowsByKo(){return state.rows.slice().sort((a,b)=>(a.koStart-b.koStart)||(a.viStart-b.viStart)||(a.id-b.id))}
function findStartIndex(ordered){const n=Math.max(1,parseInt($('startCue').value||1,10)||1);const mode=$('startMode').value||'order';if(mode==='cue'){const idx=ordered.findIndex(r=>Number(r.sourceNo)===n||Number(r.id)===n);return idx>=0?idx:Math.min(n-1,ordered.length-1)}return Math.min(n-1,ordered.length-1)}
function pickRows(n){if(!state.rows.length)return[];const ordered=rowsByKo();n=Math.min(n,ordered.length);const mode=$('pickMode').value;if(mode==='random')return shuffle(ordered.slice()).slice(0,n).sort((a,b)=>a.koStart-b.koStart);if(mode==='fromcue'){const idx=Math.max(0,findStartIndex(ordered));return ordered.slice(idx,idx+n)}const start=Math.max(0,Math.floor(Math.random()*(ordered.length-n+1)));return ordered.slice(start,start+n)}
function answerTextForMode(r,mode){if(mode==='audio_viko')return 'VI: '+clean(r.vi)+'\nKO: '+clean(r.ko);if(mode==='audio_koen')return 'KO: '+clean(r.ko)+(r.en?'\nEN: '+clean(r.en):'');if((mode==='readko_vien'||mode==='ko_vien')&&r.en)return clean(r.vi)+'\nEN: '+clean(r.en);return clean(r.vi)}
function isAudioMode(){return String($('mode').value||'').startsWith('audio_')}
function isReadKoMode(){return String($('mode').value||'').startsWith('readko_')}
function newRound(){
  if(!state.rows.length)return setStatus('Không có dữ liệu. JSON đang nạp: '+(project&&project.diagnostics?JSON.stringify(project.diagnostics):'không có diagnostics'));
  const n=parseInt($('numSentences').value||10,10), selected=pickRows(n), mode=$('mode').value;
  state.pairs=selected.map((r,idx)=>{
    if(isAudioMode()){const qLang=$('audioPromptLang').value||'ko';return {...r,left:'Audio cue '+String(idx+1).padStart(2,'0'),right:answerTextForMode(r,mode),leftLang:qLang,rightLang:qLang,audioOnlyLeft:true}}
    if(isReadKoMode()){return {...r,left:r.ko,right:answerTextForMode(r,mode),leftLang:'readko',rightLang:'vi',readKoLeft:true,audioOnlyLeft:false}}
    const target=answerTextForMode(r,mode);const koLeft=$('direction').value==='ko_left';return {...r,left:koLeft?r.ko:target,right:koLeft?target:r.ko,leftLang:koLeft?'ko':'vi',rightLang:koLeft?'vi':'ko',audioOnlyLeft:false}
  });
  state.left=state.pairs.slice().sort((a,b)=>a.koStart-b.koStart);state.right=shuffle(state.pairs.slice());state.matched=new Set();state.leftSel=null;state.rightSel=null;render();
  const f=state.left[0],l=state.left[state.left.length-1];setStatus('Lượt mới: <strong>'+state.pairs.length+'</strong> câu · KO '+fmt(f.koStart)+' → '+fmt(l.koEnd)+(isReadKoMode()?' · Read KO mode':'')+'.')
}
function render(){renderList('left');renderList('right');$('leftCount').textContent=state.left.length;$('rightCount').textContent=state.right.length}
function renderList(side){
  const el=$(side==='left'?'leftList':'rightList'),arr=side==='left'?state.left:state.right,sel=side==='left'?state.leftSel:state.rightSel;el.innerHTML='';
  arr.forEach((it,idx)=>{const rg=audioRange(it,side),div=document.createElement('div'),isMatched=state.matched.has(it.id);const audioOnly=side==='left'&&it.audioOnlyLeft;div.className='item '+(idx===sel?'selected ':'')+(isMatched?'good dim ':'')+(!audioOnly&&isKo(it[side])?'ko':'');const mainText=audioOnly?'<span class="audioBadge '+rg.lang+'">Audio cue</span>':esc(clean(it[side]));div.innerHTML=(side==='left'?'<span class="num">'+String(idx+1).padStart(2,'0')+'.</span>':'')+mainText+'<div class="meta">'+fmt(rg.start)+' → '+fmt(rg.end)+' · <span class="audioBadge '+rg.lang+'">'+rg.label+'</span></div>';const btn=document.createElement('button');btn.className='listenBtn '+rg.lang;btn.type='button';btn.textContent=rg.lang==='readko'?'Read KO':'Nghe';btn.onclick=(ev)=>{ev.stopPropagation();playSegment(it,side)};const meta=div.querySelector('.meta');if(meta)meta.appendChild(btn);div.onclick=()=>{if(side==='left')state.leftSel=idx;else state.rightSel=idx;render()};el.appendChild(div)})
}
function selected(side){const idx=side==='left'?state.leftSel:state.rightSel;if(idx===null||idx===undefined)return null;return side==='left'?state.left[idx]:state.right[idx]}
function match(){const l=selected('left'),r=selected('right');if(!l||!r)return setStatus('Bạn cần chọn 1 câu bên trái và 1 câu bên phải.');if(l.id===r.id){state.matched.add(l.id);setStatus('Đúng rồi! Điểm: <strong>'+state.matched.size+'/'+state.pairs.length+'</strong>')}else{setStatus('Chưa đúng. Thử lại nhé.')}render()}
function playSegment(item,side){if(!item)return setStatus('Bạn chưa chọn câu.');const rg=audioRange(item,side);if(rg.lang==='readko'){readKoText(item.ko,side==='left'?'Read KO bên trái':'Read KO bên phải');return}const a=audioEl(rg.lang);if(!a.src){if(item.ko)return readKoText(item.ko,'Không có audio, chuyển sang Read KO');return setStatus('Bạn chưa nạp audio '+rg.label+'.')}stopAudio();applyGameVolume(rg.lang);const off=parseFloat($('offset').value||0)||0;state.audioMode='segment';state.segmentEnd=Math.max(0,rg.end+off);a.currentTime=Math.max(0,rg.start+off+0.01);a.play().catch(()=>setStatus('Cần bấm Play trên audio một lần.'));setStatus('Đang nghe '+(side==='left'?'trái':'phải')+': '+fmt(rg.start)+' → '+fmt(rg.end)+' · '+rg.label)}
function playAudioRangePromise(rg){return new Promise(resolve=>{const a=audioEl(rg.lang);if(!a||!a.src){resolve();return}const off=parseFloat($('offset').value||0)||0;const end=Math.max(0,rg.end+off);let done=false;const cleanup=()=>{if(done)return;done=true;clearInterval(timer);resolve()};const timer=setInterval(()=>{if(state.audioMode!=='roundseq'){cleanup();return}if(a.currentTime>=end){a.pause();cleanup()}},80);applyGameVolume(rg.lang);a.currentTime=Math.max(0,rg.start+off+0.01);a.play().catch(()=>cleanup())})}
async function playRound(){if(!state.left.length)return;const side='left', items=state.left.map(x=>({...x,_rg:audioRange(x,side)})).sort((a,b)=>a._rg.start-b._rg.start);stopAudio();state.audioMode='roundseq';setStatus('Đang nghe/Read KO cả lượt: '+items.length+' câu.');for(const it of items){if(state.audioMode!=='roundseq')break;const rg=audioRange(it,side);setStatus((rg.lang==='readko'?'Read KO':'Nghe')+' cả lượt: '+(items.indexOf(it)+1)+'/'+items.length+' · '+rg.label);if(rg.lang==='readko'){await readKoPromise(it.ko)}else{await playAudioRangePromise(rg)}await new Promise(r=>setTimeout(r,180))}if(state.audioMode==='roundseq'){state.audioMode='free';setStatus('Đã nghe/Read KO xong cả lượt.')}}
function syncAudioGuard(){['vi','ko'].forEach(k=>{const a=audioEl(k);if(!a.src||a.paused)return;if(state.audioMode==='segment'&&state.segmentEnd!==null&&a.currentTime>=state.segmentEnd){a.pause();state.audioMode='free';setStatus('Đã nghe xong câu đang chọn.')}if(state.audioMode==='round'&&state.roundEnd!==null&&a.currentTime>=state.roundEnd){a.pause();state.audioMode='free';setStatus('Đã nghe xong audio cả lượt.')}})}
function showAnswer(){const left=selected('left');if(!left)return setStatus('Chọn một câu bên trái trước.');state.rightSel=state.right.findIndex(x=>x.id===left.id);render();setStatus('Đã chọn đáp án bên phải.')}
$('gameJsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());loadGameProject(data,false)}catch(err){setStatus('Không đọc được JSON dự phòng: '+(err&&err.message?err.message:err))}};
$('viFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(state.audioUrl.vi)URL.revokeObjectURL(state.audioUrl.vi);state.audioUrl.vi=URL.createObjectURL(f);$('viAudio').src=state.audioUrl.vi;try{$('viAudio').load()}catch(e){}applyGameVolume('vi');setStatus('Đã nạp VI Dub từ file máy.')};
$('koFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(state.audioUrl.ko)URL.revokeObjectURL(state.audioUrl.ko);state.audioUrl.ko=URL.createObjectURL(f);$('koAudio').src=state.audioUrl.ko;try{$('koAudio').load()}catch(e){}applyGameVolume('ko');setStatus('Đã nạp KO Live từ file máy.')};
['mode','direction','pickMode','startMode','audioPromptLang'].forEach(id=>$(id).onchange=()=>newRound());
$('newRoundBtn').onclick=newRound;$('matchBtn').onclick=match;$('playLeftBtn').onclick=()=>playSegment(selected('left'),'left');$('playRightBtn').onclick=()=>playSegment(selected('right'),'right');$('playRoundBtn').onclick=playRound;$('stopBtn').onclick=()=>{stopAudio();setStatus('Đã dừng.')};
$('fNew').onclick=newRound;$('fMatch').onclick=match;$('fLeft').onclick=()=>playSegment(selected('left'),'left');$('fRight').onclick=()=>playSegment(selected('right'),'right');$('fRound').onclick=playRound;$('fStop').onclick=()=>{stopAudio();setStatus('Đã dừng.')};$('fAnswer').onclick=showAnswer;
$('fontSize').oninput=e=>{document.documentElement.style.setProperty('--font-size',e.target.value+'px');$('fontLabel').textContent=e.target.value+' px'};$('offset').oninput=e=>$('offsetLabel').textContent=Number(e.target.value).toFixed(1)+'s';$('startCue').onchange=()=>{if($('pickMode').value!=='fromcue')$('pickMode').value='fromcue';newRound()};
['vi','ko'].forEach(k=>audioEl(k).addEventListener('timeupdate',syncAudioGuard));
initVolumeControls();
loadGameProject(project,true);
autoLoadGithubAudio();
