ged-mrd7zbw8-88","originalCueNo":124,"vi":"Cho gọi hết đến rồi bảo họ tìm cách là được.\nTôi sẽ thu xếp.","ko":"싹 다 모아서 방법 찾아내라고 하면 되지\n[태완] 준비하겠습니다","en":"Gather everyone and order them to find a way.\nI'll find one, sir.","text":"Cho gọi hết đến rồi bảo họ tìm cách là được.\nTôi sẽ thu xếp.\\n싹 다 모아서 방법 찾아내라고 하면 되지\n[태완] 준비하겠습니다\\nGather everyone and order them to find a way.\nI'll find one, sir.","koRange":{"start":1112.183279,"end":1118.162417},"viRange":{"start":1112.628498,"end":1118.009722},"start":1112.183279,"end":1118.162417,"koSentenceMarks":[1115.93,1117.672],"koShadowSegments":[{"index":0,"start":1112.183279,"end":1115.93,"text":"싹 다 모아서 방법 찾아내라고 하면 되지","speed":1,"cueUid":"merged-mrd7zbw8-88"},{"index":1,"start":1115.93,"end":1117.672,"text":"[태완] 준비하겠습니다","speed":1,"cueUid":"merged-mrd7zbw8-88"}],"hasShadow":true,"segments":[{"index":0,"start":1112.183279,"end":1115.93,"text":"싹 다 모아서 방법 찾아내라고 하면 되지","speed":1,"cueUid":"merged-mrd7zbw8-88"},{"index":1,"start":1115.93,"end":1117.672,"text":"[태완] 준비하겠습니다","speed":1,"cueUid":"merged-mrd7zbw8-88"}]},{"id":124,"cueNo":125,"displayNo":125,"sourceUid":"merged-mrd817pp-91","uid":"merged-mrd817pp-91","originalCueNo":125,"vi":"Nếu nô bộc nhà thông gia kém cỏi thì ít ra con phải động não chứ!\nTôi sẽ tìm cách. Mau đi đi.","ko":"[근철] 사돈네 머슴들이 모자라면\n너라도 대갈통 신묘하게 굴려야디!\n방법 찾아보겠습니다 빨리 나가 봐!","en":"If the in-law's servants aren't capable, then at least you should use your brains!\nI'll look for a way, sir. Get going.","text":"Nếu nô bộc nhà thông gia kém cỏi thì ít ra con phải động não chứ!\nTôi sẽ tìm cách. Mau đi đi.\\n[근철] 사돈네 머슴들이 모자라면\n너라도 대갈통 신묘하게 굴려야디!\n방법 찾아보겠습니다 빨리 나가 봐!\\nIf the in-law's servants aren't capable, then at least you should use your brains!\nI'll look for a way, sir. Get going.","koRange":{"start":1118.162417,"end":1125.555104},"viRange":{"start":1118.009722,"end":1125.41979},"start":1118.009722,"end":1125.555104,"koSentenceMarks":[1120.373,1122.179,1125.21],"koShadowSegments":[{"index":0,"start":1118.162417,"end":1120.373,"text":"[근철] 사돈네 머슴들이 모자라면","speed":1,"cueUid":"merged-mrd817pp-91"},{"index":1,"start":1120.373,"end":1122.179,"text":"너라도 대갈통 신묘하게 굴려야디!","speed":1,"cueUid":"merged-mrd817pp-91"},{"index":2,"start":1122.179,"end":1125.21,"text":"방법 찾아보겠습니다. 빨리 나가 봐!","speed":1,"cueUid":"merged-mrd817pp-91"}],"hasShadow":true,"segments":[{"index":0,"start":1118.162417,"end":1120.373,"text":"[근철] 사돈네 머슴들이 모자라면","speed":1,"cueUid":"merged-mrd817pp-91"},{"index":1,"start":1120.373,"end":1122.179,"text":"너라도 대갈통 신묘하게 굴려야디!","speed":1,"cueUid":"merged-mrd817pp-91"},{"index":2,"start":1122.179,"end":1125.21,"text":"방법 찾아보겠습니다. 빨리 나가 봐!","speed":1,"cueUid":"merged-mrd817pp-91"}]},{"id":125,"cueNo":126,"displayNo":126,"sourceUid":"ko-mrc6q93n-1256","uid":"ko-mrc6q93n-1256","originalCueNo":126,"vi":"[Geun-cheol tặc lưỡi]","ko":"[근철이 혀를 쯧쯧 찬다]","en":"[Geun-cheol clicks his tongue]","text":"[Geun-cheol tặc lưỡi]\\n[근철이 혀를 쯧쯧 찬다]\\n[Geun-cheol clicks his tongue]","koRange":null,"viRange":null,"start":1151.02,"end":1152.94,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":126,"cueNo":127,"displayNo":127,"sourceUid":"ko-mrc6q93n-1257","uid":"ko-mrc6q93n-1257","originalCueNo":127,"vi":"[Tiếng đóng cửa]","ko":"[문 닫히는 소리]","en":"[Sound of door closing]","text":"[Tiếng đóng cửa]\\n[문 닫히는 소리]\\n[Sound of door closing]","koRange":null,"viRange":null,"start":1154.61,"end":1156.11,"koSentenceMarks":[],"koShadowSegments":[],"hasShadow":false,"segments":[]},{"id":127,"cueNo":128,"displayNo":128,"sourceUid":"merged-mrd83b41-93","uid":"merged-mrd83b41-93","originalCueNo":128,"vi":"Yong Ho. Vâng, thưa bố.\nLo lắng có khiến vấn đề mất đi không?\nLà chủ tịch thì đừng có lo.\nCon phải khiến người khác lo chứ.\nĐem xả hết nỗi lo của con cho đám nô bộc ăn lương đi.","ko":"용호야. 예, 아버님\n걱정을 한다고 걱정이 사라지니?\n[근철] 회장이 와 걱정을 하니\n걱정을 하게 만들어야디\n니 걱정 월급 받는 머슴들한테 싹 다 줘 버려라","en":"Yong Ho. Yes, Father.\nWorrying doesn't make the problem go away.\nA chairman shouldn't worry.\nYou should make people worry.\nGive all your worries to the servants that you pay for.","text":"Yong Ho. Vâng, thưa bố.\nLo lắng có khiến vấn đề mất đi không?\nLà chủ tịch thì đừng có lo.\nCon phải khiến người khác lo chứ.\nĐem xả hết nỗi lo của con cho đám nô bộc ăn lương đi.\\n용호야. 예, 아버님\n걱정을 한다고 걱정이 사라지니?\n[근철] 회장이 와 걱정을 하니\n걱정을 하게 만들어야디\n니 걱정 월급 받는 머슴들한테 싹 다 줘 버려라\\nYong Ho. Yes, Father.\nWorrying doesn't make the problem go away.\nA chairman shouldn't worry.\nYou should make people worry.\nGive all your worries to the servants that you pay for.","koRange":{"start":1125.555104,"end":1148.817629},"viRange":{"start":1125.41979,"end":1148.605822},"start":1125.41979,"end":1148.817629,"koSentenceMarks":[1137.418,1140.68,1142.921,1144.421,1148.534],"koShadowSegments":[{"index":0,"start":1125.555104,"end":1137.418,"text":"용호야. 예, 아버님","speed":1,"cueUid":"merged-mrd83b41-93"},{"index":1,"start":1137.418,"end":1140.68,"text":"걱정을 한다고 걱정이 사라지니?","speed":1,"cueUid":"merged-mrd83b41-93"},{"index":2,"start":1140.68,"end":1142.921,"text":"[근철] 회장이 와 걱정을 하니","speed":1,"cueUid":"merged-mrd83b41-93"},{"index":3,"start":1142.921,"end":1144.421,"text":"걱정을 하게 만들어야디","speed":1,"cueUid":"merged-mrd83b41-93"},{"index":4,"start":1144.421,"end":1148.534,"text":"니 걱정 월급 받는 머슴들한테 싹 다 줘 버려라","speed":1,"cueUid":"merged-mrd83b41-93"}],"hasShadow":true,"segments":[{"index":0,"start":1125.555104,"end":1137.418,"text":"용호야. 예, 아버님","speed":1,"cueUid":"merged-mrd83b41-93"},{"index":1,"start":1137.418,"end":1140.68,"text":"걱정을 한다고 걱정이 사라지니?","speed":1,"cueUid":"merged-mrd83b41-93"},{"index":2,"start":1140.68,"end":1142.921,"text":"[근철] 회장이 와 걱정을 하니","speed":1,"cueUid":"merged-mrd83b41-93"},{"index":3,"start":1142.921,"end":1144.421,"text":"걱정을 하게 만들어야디","speed":1,"cueUid":"merged-mrd83b41-93"},{"index":4,"start":1144.421,"end":1148.534,"text":"니 걱정 월급 받는 머슴들한테 싹 다 줘 버려라","speed":1,"cueUid":"merged-mrd83b41-93"}]},{"id":128,"cueNo":129,"displayNo":129,"sourceUid":"merged-mrd85iac-95", -mrd8byvc-100","uid":"merged-mrd8byvc-100","originalCueNo":134,"vi":"Đây là gì vậy? A Ji biết đọc rồi mà.\nCon đọc xem.","ko":"응? 이게 뭐야? 아지 한글 알지?\n[은정] 읽어 봐","en":"What's this? You can read, right?\nRead it.","text":"Đây là gì vậy? A Ji biết đọc rồi mà.\nCon đọc xem.\\n응? 이게 뭐야? 아지 한글 알지?\n[은정] 읽어 봐\\nWhat's this? You can read, right?\nRead it.","koRange":{"start":1199,"end":1204.398639},"viRange":{"start":1199,"end":1204.994835},"start":1199,"end":1204.994835,"koSentenceMarks":[1203.458,1204.399],"koShadowSegments":[{"index":0,"start":1199,"end":1203.458,"text":"응? 이게 뭐야? 아지 한글 알지?","speed":1,"cueUid":"merged-mrd8byvc-100"},{"index":1,"start":1203.458,"end":1204.398639,"text":"[은정] 읽어 봐","speed":1,"cueUid":"merged-mrd8byvc-100"}],"hasShadow":true,"segments":[{"index":0,"start":1199,"end":1203.458,"text":"응? 이게 뭐야? 아지 한글 알지?","speed":1,"cueUid":"merged-mrd8byvc-100"},{"index":1,"start":1203.458,"end":1204.398639,"text":"[은정] 읽어 봐","speed":1,"cueUid":"merged-mrd8byvc-100"}]},{"id":134,"cueNo":135,"displayNo":135,"sourceUid":"merged-mrd8fce9-102","uid":"merged-mrd8fce9-102","originalCueNo":135,"vi":"\"Chuyên viên Cho Eun Jeong xin phép từ chức vì lý do cá nhân.\"\n\"Đơn xin thôi việc\"?\nMẹ không còn là nô lệ của đồng lương nữa. Mẹ sẽ nghỉ việc.\nThật sao? Ừ! Thật á? Ừ!\nMẹ con thất nghiệp rồi!","ko":"'조은정 차장은'\n[아지] '일신상의 사정으로 인하여'\n[흥미로운 음악] '사직을 신청합니다'\n'사직서'?\n엄마 월급 노예 아니다? 회사 그만둘 거야\n[놀라며] 진짜? [은정] 응. 정말? [은정] 어. 우리 엄마 백수다!","en":"\"Deputy Manager Cho Eun-jeong requests that she resigns from her position due to personal reasons.\"\n\"Resignation letter\"?\nI'm not going to go to work anymore. I'm going to quit.\nReally? Yes! Seriously? Yes!\nMy mom's unemployed!","text":"\"Chuyên viên Cho Eun Jeong xin phép từ chức vì lý do cá nhân.\"\n\"Đơn xin thôi việc\"?\nMẹ không còn là nô lệ của đồng lương nữa. Mẹ sẽ nghỉ việc.\nThật sao? Ừ! Thật á? Ừ!\nMẹ con thất nghiệp rồi!\\n'조은정 차장은'\n[아지] '일신상의 사정으로 인하여'\n[흥미로운 음악] '사직을 신청합니다'\n'사직서'?\n엄마 월급 노예 아니다? 회사 그만둘 거야\n[놀라며] 진짜? [은정] 응. 정말? [은정] 어. 우리 엄마 백수다!\\n\"Deputy Manager Cho Eun-jeong requests that she resigns from her position due to personal reasons.\"\n\"Resignation letter\"?\nI'm not going to go to work anymore. I'm going to quit.\nReally? Yes! Seriously? Yes!\nMy mom's unemployed!","koRange":{"start":1204.398639,"end":1225.625953},"viRange":{"start":1204.994835,"end":1226.470337},"start":1204.398639,"end":1226.470337,"koSentenceMarks":[1207.586,1210.195,1212.058,1215.644,1221.272,1225.626],"koShadowSegments":[{"index":0,"start":1204.399,"end":1207.586,"text":"'조은정 차장은'","speed":1,"cueUid":"merged-mrd8fce9-102"},{"index":1,"start":1207.586,"end":1210.195,"text":"[아지] '일신상의 사정으로 인하여'","speed":1,"cueUid":"merged-mrd8fce9-102"},{"index":2,"start":1210.195,"end":1212.058,"text":"[흥미로운 음악] '사직을 신청합니다'","speed":1,"cueUid":"merged-mrd8fce9-102"},{"index":3,"start":1212.058,"end":1215.644,"text":"'사직서'?","speed":1,"cueUid":"merged-mrd8fce9-102"},{"index":4,"start":1215.644,"end":1221.272,"text":"엄마 월급 노예 아니다? 회사 그만둘 거야","speed":1,"cueUid":"merged-mrd8fce9-102"},{"index":5,"start":1221.272,"end":1225.625953,"text":"[놀라며] 진짜? [은정] 응. 정말? [은정] 어. 우리 엄마 백수다!","speed":1,"cueUid":"merged-mrd8fce9-102"}],"hasShadow":true,"segments":[{"index":0,"start":1204.399,"end":1207.586,"text":"'조은정 차장은'","speed":1,"cueUid":"merged-mrd8fce9-102"},{"index":1,"start":1207.586,"end":1210.195,"text":"[아지] '일신상의 사정으로 인하여'","speed":1,"cueUid":"merged-mrd8fce9-102"},{"index":2,"start":1210.195,"end":1212.058,"text":"[흥미로운 음악] '사직을 신청합니다'","speed":1,"cueUid":"merged-mrd8fce9-102"},{"index":3,"start":1212.058,"end":1215.644,"text":"'사직서'?","speed":1,"cueUid":"merged-mrd8fce9-102"},{"index":4,"start":1215.644,"end":1221.272,"text":"엄마 월급 노예 아니다? 회사 그만둘 거야","speed":1,"cueUid":"merged-mrd8fce9-102"},{"index":5,"start":1221.272,"end":1225.625953,"text":"[놀라며] 진짜? [은정] 응. 정말? [은정] 어. 우리 엄마 백수다!","speed":1,"cueUid":"merged-mrd8fce9-102"}]},{"id":135,"cueNo":136,"displayNo":136,"sourceUid":"merged-mrd8gpla-103","uid": 든지 해야죠\\nWell, I'll be a freelance copywriter for the time being.\nAnd when A-ji goes to school, I'll get another job.","koRange":{"start":1234.955663,"end":1243.076184},"viRange":{"start":1235.618015,"end":1243.567814},"start":1234.955663,"end":1243.567814,"koSentenceMarks":[1239.655,1243.076],"koShadowSegments":[{"index":0,"start":1234.956,"end":1239.655,"text":"아, 뭐, 프리랜서 카피 하다가","speed":1,"cueUid":"merged-mrd8o1h1-104"},{"index":1,"start":1239.655,"end":1243.076,"text":"아지 학교 입학하면 그때 다시 회사 가든지 해야죠","speed":1,"cueUid":"merged-mrd8o1h1-104"}],"hasShadow":true,"segments":[{"index":0,"start":1234.956,"end":1239.655,"text":"아, 뭐, 프리랜서 카피 하다가","speed":1,"cueUid":"merged-mrd8o1h1-104"},{"index":1,"start":1239.655,"end":1243.076,"text":"아지 학교 입학하면 그때 다시 회사 가든지 해야죠","speed":1,"cueUid":"merged-mrd8o1h1-104"}]},{"id":137,"cueNo":138,"displayNo":138,"sourceUid":"merged-mrd8pqhy-106","uid":"merged-mrd8pqhy-106","originalCueNo":138,"vi":"Được vậy thì tốt thật.\nMẹ sẽ ở nhà chơi với mình.\nLúc nào mẹ cũng ở nhà!\nA Ji, bình tĩnh lại đi con.\nCon không bình tĩnh được.\nCon thích quá! Vui quá đi!","ko":"쯧, 그러면야 좋지만\n[아지] 우리 엄마 집에서 논다 \n계속 놀 거다!\n아지야, 진정해\n진정이 안 돼, 너무 좋아\n신난다!","en":"That's easier said than done.\nMy mom will hang around at home.\nShe's always going to be home!\nA-ji, calm down.\nBut I can't.\nI'm thrilled!\nI'm so happy!","text":"Được vậy thì tốt thật.\nMẹ sẽ ở nhà chơi với mình.\nLúc nào mẹ cũng ở nhà!\nA Ji, bình tĩnh lại đi con.\nCon không bình tĩnh được.\nCon thích quá! Vui quá đi!\\n쯧, 그러면야 좋지만\n[아지] 우리 엄마 집에서 논다 \n계속 놀 거다!\n아지야, 진정해\n진정이 안 돼, 너무 좋아\n신난다!\\nThat's easier said than done.\nMy mom will hang around at home.\nShe's always going to be home!\nA-ji, calm down.\nBut I can't.\nI'm thrilled!\nI'm so happy!","koRange":{"start":1243.076184,"end":1256.343486},"viRange":{"start":1243.567814,"end":1256.914909},"start":1243.076184,"end":1256.914909,"koSentenceMarks":[1245.495,1247.456,1249.044,1254.683,1256.343],"koShadowSegments":[{"index":0,"start":1243.0 ủa xe…\nNếu có, liệu mình cáng đáng nổi không?","ko":"[직원] 아, 이 건은 해외 촬영이 불가능해서\nCG를 최대한 늘려서\n국내 촬영으로 진행하려고 하고 있습니다\n[아인] 명분이라…\n[직원] 다만 주행 영상을 찍으려면 최소 두 대의 차량…\n[아인] 그게 있다고 감당이 될까?","en":"We can't film this abroad, so our plan is to finish up\nthe ad using CG.\nMotivation. Two cameras are needed\nto keep up with the speed of the car…\nWould that really help me handle the situation?","text":"Ta không thể quay phim ở nước ngoài, nên sẽ tận dụng kỹ xảo\nđể hoàn thành quảng cáo.\nĐộng lực. Cần có hai máy quay\nđể bắt kịp tốc độ của xe…\nNếu có, liệu mình cáng đáng nổi không?\\n[직원] 아, 이 건은 해외 촬영이 불가능해서\nCG를 최대한 늘려서\n국내 촬영으로 진행하려고 하고 있습니다\n[아인] 명분이라…\n[직원] 다만 주행 영상을 찍으려면 최소 두 대의 차량…\n[아인] 그게 있다고 감당이 될까?\\nWe can't film this abroad, so our plan is to finish up\nthe ad using CG.\nMotivation. Two cameras are needed\nto keep up with the speed of the car…\nWould that really help me handle the situation?","koRange":{"start":2167.659548,"end":2180.610495},"viRange":{"start":2167.931674,"end":2180.580611},"start":2167.659548,"end":2180.610495,"koSentenceMarks":[2170.559,2172.037,2173.738,2175.45,2180.379],"koShadowSegments":[{"index":0,"start":2167.66,"end":2170.559,"text":"[직원] 아, 이 건은 해외 촬영이 불가능해서","speed":1,"cueUid":"merged-mrdexpnn-237"},{"index":1,"start":2170.559,"end":2172.037,"text":"CG를 최대한 늘려서","speed":1,"cueUid":"merged-mrdexpnn-237"},{"index":2,"start":2172.037,"end":2173.738,"text":"국내 촬영으로 진행하려고 하고 있습니다","speed":1,"cueUid":"merged-mrdexpnn-237"},{"index":3,"start":2173.738,"end":2175.45,"text":"[아인] 명분이라…","speed":1,"cueUid":"merged-mrdexpnn-237"},{"index":4,"start":2175.45,"end":2180.379,"text":"[아인] 그게 있다고 감당이 될까?","speed":1,"cueUid":"merged-mrdexpnn-237"}],"hasShadow":true,"segments":[{"index":0,"start":2167.66,"end":2170.559,"text":"[직원] 아, 이 건은 해외 촬영이 불가능해서","speed":1,"cueUid":"merged-mrdexpnn-237"},{"index":1,"start":2170.559,"end":2172.037,"text":"CG를 최대한 늘려서","speed":1,"cueUid":"merged-mrdexpnn-237"},{"index":2,"start":2172.037,"end":2173.738,"text":"국내 촬영 }

function initFloatDrag(){const el=$('floatCtl'),h=$('floatMain');if(!el||!h)return;let sx=0,sy=0,ox=0,oy=0,drag=false,moved=false;h.addEventListener('pointerdown',function(e){if(window.innerWidth>760)return;drag=true;moved=false;sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();ox=r.left;oy=r.top;try{h.setPointerCapture(e.pointerId)}catch(_){}});h.addEventListener('pointermove',function(e){if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(!moved)return;const maxX=window.innerWidth-el.offsetWidth-8,maxY=window.innerHeight-el.offsetHeight-8;el.style.left=Math.max(8,Math.min(maxX,ox+dx))+'px';el.style.top=Math.max(8,Math.min(maxY,oy+dy))+'px';el.style.right='auto';el.style.bottom='auto'});function end(){if(!drag)return;drag=false;if(moved){el.dataset.moved='1';try{localStorage.setItem('shadowFloatPos',JSON.stringify({left:el.style.left,top:el.style.top}))}catch(_){}}}h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);try{const p=JSON.parse(localStorage.getItem('shadowFloatPos')||'null');if(p&&p.left&&p.top&&window.innerWidth<=760){el.style.left=p.left;el.style.top=p.top;el.style.right='auto';el.style.bottom='auto'}}catch(_){}}
function toggleSettings(){const s=$('settings');s.classList.toggle('hidden')}
audios.vi.ontimeupdate=function(){if(stopAt.vi!=null&&audios.vi.currentTime>=stopAt.vi){audios.vi.pause();stopAt.vi=null}}
audios.ko.ontimeupdate=function(){if(stopAt.ko!=null&&audios.ko.currentTime>=stopAt.ko){audios.ko.pause();stopAt.ko=null}}
$('q').oninput=renderList;$('viVol').oninput=function(){setVol('vi')};$('koVol').oninput=function(){setVol('ko')};$('viFile').onchange=function(e){const f=e.target.files[0];if(f){audios.vi.src=URL.createObjectURL(f);$('viAudioStatus').textContent='Đã nạp VI từ máy: '+f.name}};$('koFile').onchange=function(e){const f=e.target.files[0];if(f){audios.ko.src=URL.createObjectURL(f);$('koAudioStatus').textContent='Đã nạp KO từ máy: '+f.name}};
document.addEventListener('keydown',function(e){if(/input|textarea|select/i.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();if(audios.ko.paused)playCue('ko');else pauseAll()}if(e.key==='ArrowRight')nextCue();if(e.key==='ArrowLeft')prevCue();if(e.key==='v'||e.key==='V')playCue('vi');if(e.key==='k'||e.key==='K')playCue('ko')});
initFloatDrag();initAutoHeader();setVol('vi');setVol('ko');tryAutoAudio('vi');tryAutoAudio('ko');render();
