, and when I look at the name tag, it reads Go-A-In.","text":"Mặc một bộ đồng phục học sinh cũ với cổ tay mòn và một cỡ quá lớn. Tôi đang học một cuốn sách từ vựng tiếng Anh tồi tàn và khi tôi nhìn vào bảng tên, nó ghi Go-A-In.\n손목 끝이 다 해지고 사이즈가 한 치수쯤 큰 낡은 교복 차림. 허름한 영어 단어장을 보며 공부 중인데 이름표를 보면 고아인.\nWearing an old school uniform with worn wrists and one size too big. I'm studying through a shabby English vocabulary book, and when I look at the name tag, it reads Go-A-In.","sourceUid":"nar-mres3ysb-alhwlw","sourceNo":"N7","viRanges":[],"koRanges":[]},{"id":9,"readerNo":10,"displayNo":11,"n":11,"kind":"sub","type":"merged","vi":"Lên rủ A In cùng chơi đi. Kệ cậu ta đi. Đứng nhất trường nên tưởng chỉ có mình giỏi.","ko":"[수진] 아인이도 같이 놀자고 하자 [학생1] 아, 냅둬 전교 1등이라고 지만 잘난 줄 아니까","en":"Let's ask A-in to join us.\nLeave her alone.\nShe's so arrogant for being top of the class.","text":"Lên rủ A In cùng chơi đi. Kệ cậu ta đi. Đứng nhất trường nên tưởng chỉ có mình giỏi.\n[수진] 아인이도 같이 놀자고 하자 [학생1] 아, 냅둬 전교 1등이라고 지만 잘난 줄 아니까\nLet's ask A-in to join us.\nLeave her alone.\nShe's so arrogant for being top of the class.","sourceUid":"merged-mrc6yk2b-2938","sourceNo":11,"viRanges":[{"start":54.141617,"end":60.308186}],"koRanges":[{"start":54.572698,"end":60.551061}]},{"id":10,"readerNo":11,"displayNo":12,"n":12,"kind":"sub","type":"ko","vi":"","ko":"[애잔한 음악]","en":"","text":"[애잔한 음악]","sourceUid":"ko-mrc6q93m-968","sourceNo":12,"viRanges":[],"koRanges":[]},{"id":11,"readerNo":12,"displayNo":14,"n":14,"kind":"sub","type":"merged","vi":"Đi học thì chẳng đóng một đồng nào\nmà còn đòi đi dã ngoại.","ko":"[학생2] 돈 한 푼 안 내고 학교 다니고 소풍도 오면서","en":"She doesn't pay for school. But comes to field trips.","text":"Đi học thì chẳng đóng một đồng nào\nmà còn đòi đi dã ngoại.\n[학생2] 돈 한 푼 안 내고 학교 다니고 소풍도 오면서\nShe doesn't pay for school. But comes to field trips.","sourceUid":"merged-mrc6yxhr-2939","sourceNo":14,"viRanges":[{"start":60.308186,"end":66.537045}],"koRanges":[{"start":60.551061,"end":66.329 nh.\n[학생3] 무궁화꽃이 피었습니다\n일로 와\n빨리빨리\n무궁화꽃이 피었습니다\nHurry up.\nRed light, green light.","sourceUid":"merged-mrc842dy-5","sourceNo":24,"viRanges":[{"start":83.069653,"end":101.24217}],"koRanges":[{"start":82.848022,"end":102.993471}]},{"id":16,"readerNo":17,"displayNo":"N8","n":"N8","kind":"narration","type":"narration","vi":"Go-A-In, những gì các sinh viên khác nói. Hãy lắng nghe mọi thứ và giả vờ như không nghe thấy. Hôm nay lo lắng đến cuối cổ tay Vân Nam, nhưng lại xem lại danh sách từ vựng.","ko":"아인, 다른 학생들이 하는 말. 다 들어놓고 못 들은 척. 오늘따라 유난이 헤어진 손목 끝부분이 신경 쓰이지만 다시 단어장을 본다.","en":"Go-A-In, what other students say. Listen to everything and pretend not to hear it. Today, I'm worried about the end of Yunan's wrist, but I look at the vocabulary list again.","text":"Go-A-In, những gì các sinh viên khác nói. Hãy lắng nghe mọi thứ và giả vờ như không nghe thấy. Hôm nay lo lắng đến cuối cổ tay Vân Nam, nhưng lại xem lại danh sách từ vựng.\n아인, 다른 학생들이 하는 말. 다 들어놓고 못 들은 척. 오늘따라 유난이 헤어진 손목 끝부분이 신경 쓰이지만 다시 단어장을 본다.\nGo-A-In, what other students say. Listen to everything and pretend not to hear it. Today, I'm worried about the end of Yunan's wrist, but I look at the vocabulary list again.","sourceUid":"nar-mres6j25-wp2a61","sourceNo":"N8","viRanges":[],"koRanges":[]},{"id":17,"readerNo":18,"displayNo":"N9","n":"N9","kind":"narration","type":"narration","vi":"S#2 Điểm dã ngoại trước đây [ban ngày]","ko":"S#2 과거 소풍 장소[낮]","en":"S#2 Past picnic spot [daytime]","text":"S#2 Điểm dã ngoại trước đây [ban ngày]\nS#2 과거 소풍 장소[낮]\nS#2 Past picnic spot [daytime]","sourceUid":"nar-mres6ju9-g7ecl2","sourceNo":"N9","viRanges":[],"koRanges":[]},{"id":18,"readerNo":19,"displayNo":"N10","n":"N10","kind":"narration","type":"dialogue","vi":"여학생1: Giờ ăn trưa. Mọi người quây quần bên nhau và ăn kimbap.","ko":"여학생1:   점심시간. 다들 옹기종기 모여서 김밥 먹는데.","en":"여학생1: Lunch time. Everyone gathers together and eats kimbap.","text":"여학생1: Giờ ăn trưa. Mọi người quây quần bên nhau và ăn kimbap.\n여학생1:   점심시간. 다들 옹기종기 모여서 김밥 먹는데.\n여학생1: Lunch time. Everyone gathers together and eats kimbap.","sourceUid":"nar-mres6nsg-7fhhwl","sourceNo":"N10","viRanges":[],"koRanges":[]},{"id":19,"readerNo":20,"displayNo":"N11","n":"N11","kind":"narration","type":"narration","vi":"Go-A-In ăn một mình một góc với cơm trần và chả cá xào làm món ăn kèm.","ko":"구석에서 혼자 맨밥에 어묵볶음반찬 하나로 밥 먹는 아인.","en":"Go-A-In eating alone in a corner with bare rice and stir-fried fish cake as a side dish.","text":"Go-A-In ăn một mình một góc với cơm trần và chả cá xào làm món ăn kèm.\n구석에서 혼자 맨밥에 어묵볶음반찬 하나로 밥 먹는 아인.\nGo-A-In eating alone in a corner with bare rice and stir-fried fish cake as a side dish.","sourceUid":"nar-mres6q1b-8lj5ec","sourceNo":"N11","viRanges":[],"koRanges":[]},{"id":20,"readerNo":21,"displayNo":"N12","n":"N12","kind":"narration","type":"narration","vi":"Cô sinh viên thận trọng tiếp cận tôi.","ko":"여학생 조심스레 다가와","en":"The female student approached me cautiously.","text":"Cô sinh viên thận trọng tiếp cận tôi.\n여학생 조심스레 다가와\nThe female student approached me cautiously.","sourceUid":"nar-mres6tfm-8et3md","sourceNo":"N12","viRanges":[],"koRanges":[]},{"id":21,"readerNo":22,"displayNo":25,"n":25,"kind":"sub","type":"ko","vi":"[Bước chân đến gần]","ko":"[다가오는 발걸음]","en":"[Approaching footsteps]","text":"[Bước chân đến gần]\n[다가오는 발걸음]\n[Approaching footsteps]","sourceUid":"ko-mrc6q93m-981","sourceNo":25,"viRanges":[],"koRanges":[]},{"id":22,"readerNo":23,"displayNo":26,"n":26,"kind":"sub","type":"merged","vi":"A In ơi.\nĂn cùng tớ nhé?","ko":"[수진] 아인아 같이 먹을래?","en":"A-in.\nWant to eat together?","text":"A In ơi.\nĂn cùng tớ nhé?\n[수진] 아인아 같이 먹을래?\nA-in.\nWant to eat together?","sourceUid":"merged-mrcx8gcp-3","sourceNo":26,"viRanges":[{"start":101.24217,"end":109.949653}],"koRanges":[{"start":102.993471,"end":109.946598}]},{"id":23,"readerNo":24,"displayNo":30,"n":30,"kind":"sub","type":"merged","vi":"Cậu muốn ăn thứ này à?\nCậu nghĩ có ăn chung nổi không?\nNếu tớ với cậu ăn chung\nthì chỉ có tớ ăn chực của cậu thôi.","ko":"넌 이게 먹고 싶어?\n[아인] 같이 먹는 게 가능하겠니?\n너랑 내가 같이 먹으면 그건 내가 네 거 얻어먹는 거지","en":"Do you want this junk?\nWe can't possibly eat together.\nI'd be mooching off of your food\nif I eat with you.","text":"Cậu muốn ăn thứ này à?\nCậu nghĩ có ăn chung nổi không?\nNếu tớ với cậu ăn chung\nthì chỉ có tớ ăn chực của cậu thôi.\n넌 이게 먹고 싶어?\n[아인] 같이 먹는 게 가능하겠니?\n너랑 내가 같이 먹으면 그건 내가 네 거 얻어먹는 거지\nDo you want this junk?\nWe can't possibly eat together.\nI'd be mooching off of your food\nif I eat with you.","sourceUid":"merged-mrcxbxxm-5","sourceNo":30,"viRanges":[{"start":118,"end":126.259271}],"koRanges":[{"start":109.946598,"end":125.891882}]},{"id":24,"readerNo":25,"displayNo":33,"n":33,"kind":"sub","type":"merged","vi":"Không đâu. Tớ thích chả cá mà.\nTại sao?\nVì cậu thích cảm giác là người tốt\nkhi đối xử tử tế với một đứa đáng thương à?","ko":"아니야, 나 오뎅 좋아해\n왜?\n불쌍한 애한테 잘해 주면\n네가 좋은 사람이 된 거 같아서 기분이 좋아져?","en":"That's not true. I love fish cakes.\nWhy?\nTreating me kindly\nmakes you feel better about yourself, doesn't it?","text":"Không đâu. Tớ thích chả cá mà.\nTại sao?\nVì cậu thích cảm giác là người tốt\nkhi đối xử tử tế với một đứa đáng thương à?\n아니야, 나 오뎅 좋아해\n왜?\n불쌍한 애한테 잘해 주면\n네가 좋은 사람이 된 거 같아서 기분이 좋아져?\nThat's not true. I love fish cakes.\nWhy?\nTreating me kindly\nmakes you feel better about yourself, doesn't it?","sourceUid":"merged-mrcxfubz-7","sourceNo":33,"viRanges":[{"start":126.259271,"end":135.391746}],"koRanges":[{"start":125.891882,"end":134.621728}]},{"id":25,"readerNo":26,"displayNo":35,"n":35,"kind":"sub","type":"ko","vi":"[Âm nhạc êm dịu]","ko":"[차분한 음악]","en":"[Calm music]","text":"[Âm nhạc êm dịu]\n[차분한 음악]\n[Calm music]","sourceUid":"ko-mrc6q93m-991","sourceNo":35,"viRanges":[],"koRanges":[]},{"id":26,"readerNo":27,"displayNo":36,"n":36,"kind":"sub","type":"merged","vi":"- Tớ chỉ muốn thân hơn… - Đi đi.\nTớ ghét suốt ngày phải ăn chực lắm rồi.\nTớ không có ý đó.\nTớ không muốn ăn chực cả của cậu nữa.","ko":"난 그냥 너랑 친해지고 싶어서…\n[아인] 가\n얻어먹는 밥 지긋지긋하니까\n난 그게 아니고…\n네 거까지 얻어먹고 싶진 않아","en":"-All I wanted was to be-- -Just go.\nI'm tired of being a freeloader.\nThat's not what I meant.\nI don't want to mooch off of you.","text":"- Tớ chỉ muốn thân hơn… - Đi đi.\nTớ ghét suốt ngày phải ăn chực lắm rồi.\nTớ không có ý đó.\nTớ không muốn ăn chực cả của cậu nữa.\n난 그냥 너랑 친해지고 싶어서…\n[아인] 가\n얻어먹는 밥 지긋지긋하니까\n난 그게 아니고…\n네 거까지 얻어먹고 싶진 않아\n-All I wanted was to be-- -Just go.\nI'm tired of being a freeloader.\nThat's not what I meant.\nI don't want to mooch off of you.","sourceUid":"merged-mrcxihs8-9","sourceNo":36,"viRanges":[{"start":135.391746,"end":150.960726},{"start":135.391746,"end":144.261769}],"koRanges":[{"start":134.621728,"end":146.774487}]},{"id":27,"readerNo":28,"displayNo":43,"n":43,"kind":"sub","type":"merged","vi":"Ở đây nhiều bọ quá!\nNày, Go A In.\nCậu không cô đơn à?\nCậu không cần bạn sao?","ko":"야, 고아인\n[수진] 넌 안 외로워?\n친구 필요 없어?","en":"There are so many bugs here!\nHey, Go A-in.\nAren't you lonely?\nDon't you need friends?","text":"Ở đây nhiều bọ quá!\nNày, Go A In.\nCậu không cô đơn à?\nCậu không cần bạn sao?\n야, 고아인\n[수진] 넌 안 외로워?\n친구 필요 없어?\nThere are so many bugs here!\nHey, Go A-in.\nAren't you lonely?\nDon't you need friends?","sourceUid":"merged-mrcxmoej-11","sourceNo":43,"viRanges":[{"start":153,"end":160.063095}],"koRanges":[{"start":146.774487,"end":159.795061}]},{"id":28,"readerNo":29,"displayNo":"N13","n":"N13","kind":"narration","type":"dialogue","vi":"Go-A-In: (nhìn chằm chằm vào nữ sinh 1)","ko":"아인:   (여학생 1을 빤히 쳐다본다)","en":"Go-A-In: (stares at female student 1)","text":"Go-A-In: (nhìn chằm chằm vào nữ sinh 1)\n아인:   (여학생 1을 빤히 쳐다본다)\nGo-A-In: (stares at female student 1)","sourceUid":"nar-mres83cb-x3xhjb","sourceNo":"N13","viRanges":[],"koRanges":[]},{"id":29,"readerNo":30,"displayNo":"N14","n":"N14","kind":"narration","type":"narration","vi":"Go-A-In đang xem sách từ vựng một mình, tránh xa những học sinh đang vui vẻ sau khi nữ sinh rời đi. Nghe thấy tiếng cười của cả lớp, tự hỏi có gì mà buồn cười thế, tôi rùng mình. Tôi nhìn nó cẩn thận một lúc.","ko":"여학생이 가고 신나게 놀고 있는 학생들에게 떨어져서 혼 자 단어장을 보고 있던 아인. 뭐가 그리 재밌는지 까르륵거 리는 반 학생들 웃음소리가 들려오자 물끄러미. 한동안 찬찬 히 바라보다가.","en":"Go-A-In was looking at the vocabulary book alone, away from the students who were having fun after the female student left. When I heard the laughter of the class laughing, wondering what was so funny, I flinched. I looked at it carefully for a while.","text":"Go-A-In đang xem sách từ vựng một mình, tránh xa những học sinh đang vui vẻ sau khi nữ sinh rời đi. Nghe thấy tiếng cười của cả lớp, tự hỏi có gì mà buồn cười thế, tôi rùng mình. Tôi nhìn nó cẩn thận một lúc.\n여학생이 가고 신나게 놀고 있는 학생들에게 떨어져서 혼 자 단어장을 보고 있던 아인. 뭐가 그리 재밌는지 까르륵거 리는 반 학생들 웃음소리가 들려오자 물끄러미. 한동안 찬찬 히 바라보다가.\nGo-A-In was looking at the vocabulary book alone, away from the students who were having fun after the female student left. When I heard the laughter of the class laughing, wondering what was so funny, I flinched. I looked at it carefully for a while.","sourceUid":"nar-mres84t7-k4r3qi","sourceNo":"N14","viRanges":[],"koRanges":[]},{"id":30,"readerNo":31,"displayNo":41,"n":41,"kind":"sub","type":"merged","vi":"Tớ sợ rằng\nnếu thân nhau, cậu sẽ ghét tớ mất.","ko":"[아인] 친해지면\n나를 싫어하게 될까 봐","en":"If we become friends,\nI'm afraid that you'll hate me.","text":"Tớ sợ rằng\nnếu thân nhau, cậu sẽ ghét tớ mất.\n[아인] 친해지면\n나를 싫어하게 될까 봐\nIf we become friends,\nI'm afraid that you'll hate me.","sourceUid":"merged-mrcxok4r-12","sourceNo":41,"viRanges":[{"start":179,"end":184.549615}],"koRanges":[{"start":179,"end":184.149782}]},{"id":31,"readerNo":32,"displayNo":47,"n":47,"kind":"sub","type":"merged","vi":"Tớ sợ một ngày cậu sẽ bỏ tớ mà đi.\nNhư vậy, tớ sẽ sống trong bất an.","ko":"언젠가 버리고 떠날까 봐\n불안해하지 않을까?","en":"I'm scared you might abandon me someday.\nI'll be too anxious.","text":"Tớ sợ một ngày cậu sẽ bỏ tớ mà đi.\nNhư vậy, tớ sẽ sống trong bất an.\n언젠가 버리고 떠날까 봐\n불안해하지 않을까?\nI'm scared you might abandon me someday.\nI 서?\n[아인] 그렇게 다 용서하면 나한테 뭐가 남지?","en":"[laughter]\nForgive?\nIf I forgive everything, what is left of me?","text":"[cười]\nTha thứ?\nNếu tha thứ cho tất cả thì mình còn lại gì?\n[피식 웃는다]\n[헛웃음] 용서?\n[아인] 그렇게 다 용서하면 나한테 뭐가 남지?\n[laughter]\nForgive?\nIf I forgive everything, what is left of me?","sourceUid":"merged-mrd2fkyj-25","sourceNo":182,"viRanges":[{"start":673.575433,"end":687.15125}],"koRanges":[{"start":672.740349,"end":686.08896}]},{"id":108,"readerNo":109,"displayNo":"N39","n":"N39","kind":"narration","type":"narration","vi":"S#10 Tâm thần học/Thang máy (Đêm)","ko":"S#10 정신과/엘리베이터(밤)","en":"S#10 Psychiatry/Elevator (Night)","text":"S#10 Tâm thần học/Thang máy (Đêm)\nS#10 정신과/엘리베이터(밤)\nS#10 Psychiatry/Elevator (Night)","sourceUid":"nar-mrf0wmih-kg20o2","sourceNo":"N39","viRanges":[],"koRanges":[]},{"id":109,"readerNo":110,"displayNo":"N40","n":"N40","kind":"narration","type":"narration","vi":"Go-A-In với tư thế cúi đầu.","ko":"고개를 숙이고 있는 아인.","en":"Go-A-In with his head down.","text":"Go-A-In với tư thế cúi đầu.\n고개를 숙이고 있는 아인.\nGo-A-In with his head down.","sourceUid":"nar-mrf0wntz-ec9wip","sourceNo":"N40","viRanges":[],"koRanges":[]},{"id":110,"readerNo":111,"displayNo":"N41","n":"N41","kind":"narration","type":"narration","vi":"Nước mắt đang rơi và tôi đang cố gắng kìm lại. Tôi lấy khăn giấy từ trong túi xách ra lau, vừa nhìn vào gương thang máy thì thấy mắt và mũi mình đều đỏ bừng. Tôi ghét bản thân mình như thế này. Tôi không thích mềm yếu và yếu đuối.","ko":"눈물이 후드득 떨어지고 있고, 참아보려고 애를 쓴다. 핸드백에서 휴지를 꺼내 엘리베이터 거울을 보며 닦는데, 눈 과 코가 빨개진 자신이 보인다. 이런 자신이 싫다. 여리고 약 한 모습이 싫은데.","en":"Tears are falling, and I'm trying hard to hold them back. I take out a tissue from my handbag and wipe it while looking at the elevator mirror, and I see that my eyes and nose are red. I hate myself like this. I don't like being soft and weak.","text":"Nước mắt đang rơi và tôi đang cố gắng kìm lại. Tôi lấy khăn giấy từ trong túi xách ra lau, vừa nhìn vào gương thang máy thì thấy mắt và mũi mình đều đỏ bừng. Tôi ghét bản thân mình như thế này. Tôi không thích mềm yếu và yếu đuối.\n눈물이 후드득 떨어지고 있고, 참아보려고 애를 쓴다. 핸드백에서 휴지를 꺼내 엘리베이터 거울을 보며 닦는데, 눈 과 코가 빨개진 자신이 보인다. 이런 자신이 싫다. 여리고 약 한 모습이 싫은데.\nTears are falling, and I'm trying hard to hold them back. I take out a tissue from my handbag and wipe it while looking at the elevator mirror, and I see that my eyes and nose are red. I hate myself like this. I don't like being soft and weak.","sourceUid":"nar-mrf0wp3z-29n8id","sourceNo":"N41","viRanges":[],"koRanges":[]},{"id":111,"readerNo":112,"displayNo":"N42","n":"N42","kind":"narration","type":"dialogue","vi":"Go-A-In: Tha thứ? Nếu tôi tha thứ mọi chuyện như vậy thì tôi còn lại gì?","ko":"아인:   용서? 그렇게 다 용서하면, 나한텐 뭐가 남지?","en":"Go-A-In: Forgiveness? If I forgive everything like that, what will be left for me?","text":"Go-A-In: Tha thứ? Nếu tôi tha thứ mọi chuyện như vậy thì tôi còn lại gì?\n아인:   용서? 그렇게 다 용서하면, 나한텐 뭐가 남지?\nGo-A-In: Forgiveness? If I forgive everything like that, what will be left for me?","sourceUid":"nar-mrf0wwlq-3vha0b","sourceNo":"N42","viRanges":[],"koRanges":[]},{"id":112,"readerNo":113,"displayNo":"N43","n":"N43","kind":"narration","type":"narration","vi":"Khi cửa thang máy mở ra, Go-A-In hít một hơi thật sâu và bước đi.","ko":"엘리베이터 문이 열리자 심호흡을 하고 걸어가는 아인이다.","en":"When the elevator door opens, Go-A-In takes a deep breath and walks away.","text":"Khi cửa thang máy mở ra, Go-A-In hít một hơi thật sâu và bước đi.\n엘리베이터 문이 열리자 심호흡을 하고 걸어가는 아인이다.\nWhen the elevator door opens, Go-A-In takes a deep breath and walks away.","sourceUid":"nar-mrf0wxbg-cazc7l","sourceNo":"N43","viRanges":[],"koRanges":[]},{"id":113,"readerNo":114,"displayNo":"N44","n":"N44","kind":"narration","type":"narration","vi":"S#11 Jo-Eun-Jeong Nhà/Phòng khách [Đêm]","ko":"S#11 은정 집/거실[밤]","en":"S#11 Deputy Manager (Jo Eun-jeong) Home/Living Room [Night]","text":"S#11 Jo-Eun-Jeong Nhà/Phòng khách [Đêm]\nS#11 은정 집/거실[밤]\nS#11 Deputy Manager (Jo Eun-jeong) Home/Living hủ giật mình bỏ đi, hai người đàn ông đeo túi thể thao lớn và mặc đồ thể thao ở bàn bên cạnh liếc nhìn, người chồng cố gắng an ủi họ.","ko":"주인은 흠칫 놀라서 가고, 옆 테이블의 큰 스포츠백과 운동 복 차림 두 남자가 흘끔 보고, 남편은 달래보려 하고.","en":"The owner was startled and left, two men wearing a large sports bag and sportswear at the table next to him glanced, and the husband tried to comfort them.","text":"Người chủ giật mình bỏ đi, hai người đàn ông đeo túi thể thao lớn và mặc đồ thể thao ở bàn bên cạnh liếc nhìn, người chồng cố gắng an ủi họ.\n주인은 흠칫 놀라서 가고, 옆 테이블의 큰 스포츠백과 운동 복 차림 두 남자가 흘끔 보고, 남편은 달래보려 하고.\nThe owner was startled and left, two men wearing a large sports bag and sportswear at the table next to him glanced, and the husband tried to comfort them.","sourceUid":"nar-mrf10ifv-4vonfh","sourceNo":"N53","viRanges":[],"koRanges":[]},{"id":141,"readerNo":142,"displayNo":223,"n":223,"kind":"sub","type":"merged","vi":"- Em điên rồi. - Chính anh dụ dỗ em\nnên em mới kết hôn sớm, lại còn có con mà.","ko":"[정호] 왜 이래, 미쳤어\n네가 그렇게 꼬셔 가지고\n결혼도 일찍 하고 애도 낳은 거잖아","en":"-You're crazy. -You coaxed me\ninto marrying early and having a kid.","text":"- Em điên rồi. - Chính anh dụ dỗ em\nnên em mới kết hôn sớm, lại còn có con mà.\n[정호] 왜 이래, 미쳤어\n네가 그렇게 꼬셔 가지고\n결혼도 일찍 하고 애도 낳은 거잖아\n-You're crazy. -You coaxed me\ninto marrying early and having a kid.","sourceUid":"merged-mrd38mud-46","sourceNo":223,"viRanges":[{"start":840.754745,"end":846.08177}],"koRanges":[{"start":840.427851,"end":845.666869}]},{"id":142,"readerNo":143,"displayNo":225,"n":225,"kind":"sub","type":"merged","vi":"Nói thật thì thằng bé\nđược anh và mẹ nuôi mà.","ko":"솔직히 다 키웠잖아\n나랑 엄마가","en":"Honestly, he was raised…\nby my mom and me.","text":"Nói thật thì thằng bé\nđược anh và mẹ nuôi mà.\n솔직히 다 키웠잖아\n나랑 엄마가\nHonestly, he was raised…\nby my mom and me.","sourceUid":"merged-mrd39jdu-47","sourceNo":225,"viRanges":[{"start":846.08177,"end":855.213029}],"koRanges":[{"start":845.666869,"end":854.574624}]},{"id":143,"readerNo":144,"displayNo":20 ồng Hổ]","ko":"[용호의 한숨]","en":"[Dragon Tiger's Sigh]","text":"[Tiếng thở dài của Rồng Hổ]\n[용호의 한숨]\n[Dragon Tiger's Sigh]","sourceUid":"ko-mrc6q93n-1234","sourceNo":278,"viRanges":[],"koRanges":[]},{"id":180,"readerNo":181,"displayNo":280,"n":280,"kind":"sub","type":"merged","vi":"Nô bộc bên Tập đoàn Woowon\nlàm việc kiểu gì mà lại để chủ tịch bị bắt vậy?","ko":"[근철] 우원그룹 머슴들은\n일을 어케 하길래 회장을 징역 보내니?","en":"How could the Woowon Group servants\nlet their chairman get arrested?","text":"Nô bộc bên Tập đoàn Woowon\nlàm việc kiểu gì mà lại để chủ tịch bị bắt vậy?\n[근철] 우원그룹 머슴들은\n일을 어케 하길래 회장을 징역 보내니?\nHow could the Woowon Group servants\nlet their chairman get arrested?","sourceUid":"merged-mrd7s167-80","sourceNo":280,"viRanges":[{"start":1071.430478,"end":1080.207636}],"koRanges":[{"start":1071.398389,"end":1080.02569}]},{"id":181,"readerNo":182,"displayNo":284,"n":284,"kind":"sub","type":"merged","vi":"- Trưởng phòng Kim. - Vâng.\nNếu ông ta bị kết án,\nthì còn quyền cổ đông không?\nNếu là tội biển thủ…\nTôi sẽ kiểm tra.","ko":"- 실장! - [태완] 예\n실형받으면 주총 때 의결권은 있니?\n배임 횡령이면…\n확인해 보겠습니다","en":"-Hey, Mr. Kim. -Yes, sir.\nIf he gets sentenced,\ncan he vote as a shareholder?\nIf it's embezzlement…\nI will check.","text":"- Trưởng phòng Kim. - Vâng.\nNếu ông ta bị kết án,\nthì còn quyền cổ đông không?\nNếu là tội biển thủ…\nTôi sẽ kiểm tra.\n- 실장! - [태완] 예\n실형받으면 주총 때 의결권은 있니?\n배임 횡령이면…\n확인해 보겠습니다\n-Hey, Mr. Kim. -Yes, sir.\nIf he gets sentenced,\ncan he vote as a shareholder?\nIf it's embezzlement…\nI will check.","sourceUid":"merged-mrd7ugzv-82","sourceNo":284,"viRanges":[{"start":1080.207636,"end":1093.985777}],"koRanges":[{"start":1080.02569,"end":1093.467157}]},{"id":182,"readerNo":183,"displayNo":285,"n":285,"kind":"sub","type":"ko","vi":"[thở không bằng lòng]","ko":"[못마땅한 숨소리]","en":"[disapproving breath]","text":"[thở không bằng lòng]\n[못마땅한 숨소리]\n[disapproving breath]","sourceUid":"ko-mrc6q93n-1241","sourceNo":285,"viRanges":[],"koRanges":[]},{"id":183,"readerNo":184,"displayNo":288,"n":288,"kind":"sub","type":"merged","vi":"Liệu có cách nào giúp ông ta không ạ?\nCó đấy.\nCho con biết được không?","ko":"[용호] 아버님 무슨 방법이 없을까요?\n그럼 말씀 좀…\n- [흥미로운 음악] - 있디","en":"Do you think there's any way to help?\nThere is.\nThen could you tell me?","text":"Liệu có cách nào giúp ông ta không ạ?\nCó đấy.\nCho con biết được không?\n[용호] 아버님 무슨 방법이 없을까요?\n그럼 말씀 좀…\n- [흥미로운 음악] - 있디\nDo you think there's any way to help?\nThere is.\nThen could you tell me?","sourceUid":"merged-mrd7wnf7-85","sourceNo":288,"viRanges":[{"start":1093.985777,"end":1101.889269},{"start":1093.985777,"end":1100.066503}],"koRanges":[{"start":1093.467157,"end":1101.972284}]},{"id":184,"readerNo":185,"displayNo":290,"n":290,"kind":"sub","type":"ko","vi":"[Geun-cheol hít một hơi thật sâu]","ko":"[근철이 숨을 씁 들이켠다]","en":"[Geun-cheol takes a deep breath]","text":"[Geun-cheol hít một hơi thật sâu]\n[근철이 숨을 씁 들이켠다]\n[Geun-cheol takes a deep breath]","sourceUid":"ko-mrc6q93n-1246","sourceNo":290,"viRanges":[],"koRanges":[]},{"id":185,"readerNo":186,"displayNo":293,"n":293,"kind":"sub","type":"merged","vi":"Sao mà bố biết được?\nCon trả lương cho nhân viên làm gì?\nDạ?\nThuê mấy cái đầu thông minh về làm gì hả?","ko":"그걸 내가 어떻게 아니?\n[근철] 넌 뭐 하러 월급을 주니?\n예?\n[근철] 아, 이 머리 좋은 놈들 와 모아 놨어","en":"How would I know?\nWhy do you pay your employees?\nSorry?\nWhy do you have all these clever people here?","text":"Sao mà bố biết được?\nCon trả lương cho nhân viên làm gì?\nDạ?\nThuê mấy cái đầu thông minh về làm gì hả?\n그걸 내가 어떻게 아니?\n[근철] 넌 뭐 하러 월급을 주니?\n예?\n[근철] 아, 이 머리 좋은 놈들 와 모아 놨어\nHow would I know?\nWhy do you pay your employees?\nSorry?\nWhy do you have all these clever people here?","sourceUid":"merged-mrd7y5w2-87","sourceNo":293,"viRanges":[{"start":1101.889269,"end":1112.628498}],"koRanges":[{"start":1101.972284,"end":1112.183279}]},{"id":186,"readerNo":187,"displayNo":295,"n":295,"kind":"sub","type":"merged","vi":"Cho gọi hết đến rồi bảo họ tìm cách là được.\nTôi sẽ thu xếp.","ko":"싹 다 모아서 방법 찾아내라고 하면 되지\n[태완] 준비하겠습니다","en":"Gather everyone and order them to find a way.\nI'll find one, sir.","text":"Cho gọi hết đến rồi bảo họ tìm cách là được.\nTôi sẽ thu xếp.\n싹 다 모아서 방법 찾아내라고 하면 되지\n[태완] 준비하겠습니다\nGather everyone and order them to find a way.\nI'll find one, sir.","sourceUid":"merged-mrd7zbw8-88","sourceNo":295,"viRanges":[{"start":1112.628498,"end":1118.009722}],"koRanges":[{"start":1112.183279,"end":1118.162417}]},{"id":187,"readerNo":188,"displayNo":299,"n":299,"kind":"sub","type":"merged","vi":"Nếu nô bộc nhà thông gia kém cỏi thì ít ra con phải động não chứ!\nTôi sẽ tìm cách.\nMau đi đi.","ko":"[근철] 사돈네 머슴들이 모자라면\n너라도 대갈통 신묘하게 굴려야디!\n방법 찾아보겠습니다\n빨리 나가 봐!","en":"If the in-law's servants aren't capable, then at least you should use your brains!\nI'll look for a way, sir.\nGet going.","text":"Nếu nô bộc nhà thông gia kém cỏi thì ít ra con phải động não chứ!\nTôi sẽ tìm cách.\nMau đi đi.\n[근철] 사돈네 머슴들이 모자라면\n너라도 대갈통 신묘하게 굴려야디!\n방법 찾아보겠습니다\n빨리 나가 봐!\nIf the in-law's servants aren't capable, then at least you should use your brains!\nI'll look for a way, sir.\nGet going.","sourceUid":"merged-mrd817pp-91","sourceNo":299,"viRanges":[{"start":1118.009722,"end":1125.41979}],"koRanges":[{"start":1118.162417,"end":1125.555104}]},{"id":188,"readerNo":189,"displayNo":300,"n":300,"kind":"sub","type":"ko","vi":"[Geun-cheol tặc lưỡi]","ko":"[근철이 혀를 쯧쯧 찬다]","en":"[Geun-cheol clicks his tongue]","text":"[Geun-cheol tặc lưỡi]\n[근철이 혀를 쯧쯧 찬다]\n[Geun-cheol clicks his tongue]","sourceUid":"ko-mrc6q93n-1256","sourceNo":300,"viRanges":[],"koRanges":[]},{"id":189,"readerNo":190,"displayNo":301,"n":301,"kind":"sub","type":"ko","vi":"[Tiếng đóng cửa]","ko":"[문 닫히는 소리]","en":"[Sound of door closing]","text":"[Tiếng đóng cửa]\n[문 닫히는 소리]\n[Sound of door closing]","sourceUid":"ko-mrc6q93n-1257","sourceNo":301,"viRanges":[],"koRanges":[]},{"id":190,"readerNo":191,"displayNo":305,"n":305,"kind":"sub","type":"merged","vi":"Yong Ho.\nVâng, thưa bố.\nLo lắng có khiến vấn đề mất đi không?\nLà chủ tịch thì đừng có lo.\nCon phải khiến người khác lo chứ.\nĐem xả hết nỗi lo của con cho đám nô bộc ăn lương đi.","ko":"용호야\n예, 아버님\n걱정을 한다고 걱정이 사라지니?\n[근철] 회장이 와 걱정을 하니\n걱정을 하게 만들어야디\n니 걱정 월급 받는 머슴들한테 싹 다 줘 버려라","en":"Yong Ho.\nYong-ho.\nYes, Father.\nWorrying doesn't make the problem go away.\nA chairman shouldn't worry.\nYou should make people worry.\nGive all your worries to the servants that you pay for.","text":"Yong Ho.\nVâng, thưa bố.\nLo lắng có khiến vấn đề mất đi không?\nLà chủ tịch thì đừng có lo.\nCon phải khiến người khác lo chứ.\nĐem xả hết nỗi lo của con cho đám nô bộc ăn lương đi.\n용호야\n예, 아버님\n걱정을 한다고 걱정이 사라지니?\n[근철] 회장이 와 걱정을 하니\n걱정을 하게 만들어야디\n니 걱정 월급 받는 머슴들한테 싹 다 줘 버려라\nYong Ho.\nYong-ho.\nYes, Father.\nWorrying doesn't make the problem go away.\nA chairman shouldn't worry.\nYou should make people worry.\nGive all your worries to the servants that you pay for.","sourceUid":"merged-mrd83b41-93","sourceNo":305,"viRanges":[{"start":1125.41979,"end":1148.605822}],"koRanges":[{"start":1125.555104,"end":1148.817629}]},{"id":191,"readerNo":192,"displayNo":308,"n":308,"kind":"sub","type":"merged","vi":"Vâng. Bố dùng bữa đi ạ.","ko":"네, 식사하셔야죠","en":"Yes, Father. You should eat.","text":"Vâng. Bố dùng bữa đi ạ.\n네, 식사하셔야죠\nYes, Father. You should eat.","sourceUid":"merged-mrd85iac-95","sourceNo":308,"viRanges":[{"start":1148.605822,"end":1151.864035}],"koRanges":[{"start":1148.817629,"end":1151.717232}]},{"id":192,"readerNo":193,"displayNo":309,"n":309,"kind":"sub","type":"ko","vi":"[Tiếng đóng cửa]","ko":"[문 닫히는 소리]","en":"[Sound of door closing]","text":"[Tiếng đóng cửa]\n[문 닫히는 소리]\n[Sound of door closing]","sourceUid":"ko-mrc6q93n-1265","sourceNo":309,"viRanges":[],"koRanges":[]},{"id":193,"readerNo":194,"displayNo":"N65","n":"N65","kind":"narration","type":"narration","vi":"S#15 Jo-Eun-Jeong Nhà/Phòng khách (Buổi sáng)","ko":"S#15 은정 집/거실(아침]","en":"S#15 Deputy Manager (Jo Eun-jeong) Home/Living Room (Morning]","text":"S#15 Jo-Eun-Jeong Nhà/Phòng khách (Buổi sáng)\nS#15 은정 집/거실(아침]\nS#15 Deputy Manager (Jo Eun-jeong) Home/Living Room (Morning]","sourceUid":"nar-mrf2875c-i9129b","sourceNo":"N65","viRanges":[],"koRanges":[]},{"id":194,"readerNo":195,"displayNo":"N64","n":"N64","kind":"narration","type":"narration","vi":"Jo-Eun-Jeong bước ra khỏi phòng khách và nhìn Park-Jeong-Sook đang làm bữa sáng với vẻ lo lắng.","ko":"안방에서 나오는 은정, 아침 차리던 시어머니가 걱정스럽게 보며","en":"Deputy Manager (Jo Eun-jeong) came out of the living room and looked worried at Park-Jeong-Sook (Eun-Jeong’s mother-in-law) who was making breakfast.","text":"Jo-Eun-Jeong bước ra khỏi phòng khách và nhìn Park-Jeong-Sook đang làm bữa sáng với vẻ lo lắng.\n안방에서 나오는 은정, 아침 차리던 시어머니가 걱정스럽게 보며\nDeputy Manager (Jo Eun-jeong) came out of the living room and looked worried at Park-Jeong-Sook (Eun-Jeong’s mother-in-law) who was making breakfast.","sourceUid":"nar-mrf27sak-5jennv","sourceNo":"N64","viRanges":[],"koRanges":[]},{"id":195,"readerNo":196,"displayNo":312,"n":312,"kind":"sub","type":"merged","vi":"Hôm nay con không ăn sáng đâu ạ.\nCó ổn không đấy?\nHôm qua con uống nhiều lắm mà.\nĐối với nô lệ của tư bản, bụng đói không đáng sợ bằng muộn làm.","ko":"[은정] 노예는 아침밥 패스요\n[정숙] 괜찮겠냐? 너 어제 과음했잖아\n아, 월급 노예한테는 빈속보단 지각이 더 무섭죠","en":"No breakfast for me today. Will you be okay? You were wasted yesterday. I'm more afraid of being late to work than an empty stomach.","text":"Hôm nay con không ăn sáng đâu ạ.\nCó ổn không đấy?\nHôm qua con uống nhiều lắm mà.\nĐối với nô lệ của tư bản, bụng đói không đáng sợ bằng muộn làm.\n[은정] 노예는 아침밥 패스요\n[정숙] 괜찮겠냐? 너 어제 과음했잖아\n아, 월급 노예한테는 빈속보단 지각이 더 무섭죠\nNo breakfast for me today. Will you be okay? You were wasted yesterday. I'm more afraid of being late to work than an empty stomach.","sourceUid":"merged-mrd877dy-97","sourceNo":312,"viRanges":[{"start":1151.864035,"end":1164.593195}],"koRanges":[{"start":1151.717232,"end":1164.18976}]},{"id":196,"readerNo":197,"displayNo":315,"n":315,"kind":"sub","type":"ko","v  việc. - Thật sao? - Ừ! - Thật á? - Ừ! Mẹ con thất nghiệp rồi!\n'조은정 차장은' [아지] '일신상의 사정으로 인하여' - [흥미로운 음악] - '사직을 신청합니다' '사직서'?\n엄마 월급 노예 아니다? 회사 그만둘 거야 - [놀라며] 진짜? - [은정] 응 - 정말? - [은정] 어 우리 엄마 백수다!\n\"Deputy Manager Cho Eun-jeong requests that she resigns from her position due to personal reasons.\"\n\"Resignation letter\"? I'm not going to go to work anymore. I'm going to quit. -Really? -Yes! -Seriously? -Yes!\nMy mom's unemployed!","sourceUid":"merged-mrd8fce9-102","sourceNo":329,"viRanges":[{"start":1204.994835,"end":1226.470337}],"koRanges":[{"start":1204.398639,"end":1225.625953}]},{"id":200,"readerNo":201,"displayNo":"333","n":"333","kind":"sub","type":"merged","vi":"Cuối cùng mẹ cũng ở nhà rồi! Phải khoe với các bạn mới được. Vui quá đi! Này. Con sẽ không sao chứ?","ko":"[아지] 이제 집에 있는다! 애들한테 자랑해야겠다 신난다! [정숙] 야, 너 괜찮겠냐?","en":"She's finally going to be home! I'm going to tell my friends. I love it! Hey. Will you be okay?","text":"Cuối cùng mẹ cũng ở nhà rồi! Phải khoe với các bạn mới được. Vui quá đi! Này. Con sẽ không sao chứ?\n[아지] 이제 집에 있는다! 애들한테 자랑해야겠다 신난다! [정숙] 야, 너 괜찮겠냐?\nShe's finally going to be home! I'm going to tell my friends. I love it! Hey. Will you be okay?","sourceUid":"merged-mrd8gpla-103","sourceNo":333,"viRanges":[{"start":1226.470337,"end":1235.618015}],"koRanges":[{"start":1225.625953,"end":1234.955663}]},{"id":201,"readerNo":202,"displayNo":"297","n":"297","kind":"sub","type":"merged","vi":"Thôi thì tạm thời, con sẽ làm tự do. Khi nào A Ji bắt đầu đi học thì con sẽ đi làm lại.","ko":"아, 뭐, 프리랜서 카피 하다가 아지 학교 입학하면 그때 다시 회사 가든지 해야죠","en":"Well, I'll be a freelance copywriter for the time being. And when A-ji goes to school, I'll get another job.","text":"Thôi thì tạm thời, con sẽ làm tự do. Khi nào A Ji bắt đầu đi học thì con sẽ đi làm lại.\n아, 뭐, 프리랜서 카피 하다가 아지 학교 입학하면 그때 다시 회사 가든지 해야죠\nWell, I'll be a freelance copywriter for the time being. And when A-ji goes to school, I'll get another job.","sourceUid":"merged-mrd8o1h1-104","sourceNo":297,"viRanges":[{"start":1235.618015,"end":1243.567814}],"koRanges":[{"start":1234.955663,"end":1243.076184}]},{"id":202,"readerNo":203,"displayNo":"341","n":"341","kind":"sub","type":"merged","vi":"Được vậy thì tốt thật. Mẹ sẽ ở nhà chơi với mình. Lúc nào mẹ cũng ở nhà! A Ji, bình tĩnh lại đi con.\nCon không bình tĩnh được. Con thích quá! Vui quá đi!","ko":"쯧, 그러면야 좋지만 - [아지] 우리 엄마 집에서 논다 - [잔잔한 음악] 계속 놀 거다!\n아지야, 진정해 진정이 안 돼, 너무 좋아\n신난다!","en":"That's easier said than done. My mom will hang around at home. She's always going to be home!\nA-ji, calm down. But I can't. I'm thrilled! I'm so happy!","text":"Được vậy thì tốt thật. Mẹ sẽ ở nhà chơi với mình. Lúc nào mẹ cũng ở nhà! A Ji, bình tĩnh lại đi con.\nCon không bình tĩnh được. Con thích quá! Vui quá đi!\n쯧, 그러면야 좋지만 - [아지] 우리 엄마 집에서 논다 - [잔잔한 음악] 계속 놀 거다!\n아지야, 진정해 진정이 안 돼, 너무 좋아\n신난다!\nThat's easier said than done. My mom will hang around at home. She's always going to be home!\nA-ji, calm down. But I can't. I'm thrilled! I'm so happy!","sourceUid":"merged-mrd8pqhy-106","sourceNo":341,"viRanges":[{"start":1243.567814,"end":1256.914909}],"koRanges":[{"start":1243.076184,"end":1256.343486}]},{"id":203,"readerNo":204,"displayNo":"344","n":"344","kind":"sub","type":"merged","vi":"[Âm thanh vận hành khóa cửa] [Tiếng đóng cửa] - [Thở dài] - [Âm thanh vận hành khóa cửa]","ko":"[도어 록 작동음] [문 닫히는 소리] - [한숨] - [도어 록 작동음]","en":"[Door lock operating sound] [Sound of door closing] - [Sigh] - [Door lock operating sound]","text":"[Âm thanh vận hành khóa cửa] [Tiếng đóng cửa] - [Thở dài] - [Âm thanh vận hành khóa cửa]\n[도어 록 작동음] [문 닫히는 소리] - [한숨] - [도어 록 작동음]\n[Door lock operating sound] [Sound of door closing] - [Sigh] - [Door lock operating sound]","sourceUid":"merged-mrd8qkrx-107","sourceNo":344,"viRanges":[],"koRanges":[]},{"id":204,"readerNo":205,"displayNo":307,"n":307,"kind":"sub","type":"merged","vi":"ĐƠN XIN THÔI VIỆC","ko":"","en":"RESIGNATION LETTER","text":"ĐƠN XIN THÔI VIỆC\nRESIGNATION LETTER","sourceUid":"mer mpany's cafeteria\nwhen I started the company.","text":"Lần này để cô dễ bộc lộ yêu ghét, tôi đã chọn một chỗ rẻ.\nNơi này có vẻ khá lâu đời.\nĐây là nhà ăn của công ty tôi\nkhi mới được thành lập.\n[재훈] 이번엔 호불호 드러내기 쉬우시라고\n싼 데로 왔습니다\n[아인] 오래된 집인가 보네요\n제가 회사 처음 시작했을 때\n여기가 구내식당이었죠\nI chose a cheaper place this time, so feel free to express your feelings.\nIt's quite old.\nThis was my company's cafeteria\nwhen I started the company.","sourceUid":"merged-mrdbe3ro-159","sourceNo":437,"viRanges":[{"start":1535,"end":1547.291509}],"koRanges":[{"start":1535,"end":1546.976528}]},{"id":262,"readerNo":263,"displayNo":440,"n":440,"kind":"sub","type":"merged","vi":"Ôi chao, tôi sắp quên mặt cậu đến nơi rồi.\nCháu đến để bác không quên đây.","ko":"[주인] 아이고, 얼굴 까먹겠어\n까먹지 말라고 왔잖아요","en":"Gosh, it's been so long. I'm going to forget your face.\nI came so you wouldn't.","text":"Ôi chao, tôi sắp quên mặt cậu đến nơi rồi.\nCháu đến để bác không quên đây.\n[주인] 아이고, 얼굴 까먹겠어\n까먹지 말라고 왔잖아요\nGosh, it's been so long. I'm going to forget your face.\nI came so you wouldn't.","sourceUid":"merged-mrdbekd3-160","sourceNo":440,"viRanges":[{"start":1550,"end":1555.725931}],"koRanges":[{"start":1550,"end":1555.225435}]},{"id":263,"readerNo":264,"displayNo":442,"n":442,"kind":"sub","type":"merged","vi":"Bạn gái à?\nKhông ạ.","ko":"여자 친구?\n아니요","en":"Your girlfriend?\nNo.","text":"Bạn gái à?\nKhông ạ.\n여자 친구?\n아니요\nYour girlfriend?\nNo.","sourceUid":"merged-mrdbflnq-161","sourceNo":442,"viRanges":[],"koRanges":[{"start":1555.225435,"end":1558.606841}]},{"id":264,"readerNo":265,"displayNo":"445","n":"445","kind":"sub","type":"merged","vi":"- May quá. - May chỗ nào ạ? Con bé trông gầy gò và xinh đẹp đấy, nhưng đôi mắt đầy tham vọng lắm.\nKhông phải tướng phụ nữ giỏi chăm lo gia đình.","ko":"[주인] 다행이네\n[재훈] 뭐가요?\n[주인] 얄쌍하니 새초롬한 게 예쁘긴 헌데\n눈두덩에 욕심이 그득한 게 애 낳고 살림할 관상은 아니여","en":"-That's a relief. -What do you mean? She may look slim and pretty, but I can see the greed in her eyes.\nShe doesn't seem like 6226}]},{"id":267,"readerNo":268,"displayNo":"453","n":"453","kind":"sub","type":"merged","vi":"Ăn nhiều vào. Bọn cháu sẽ ăn nhiều. Cậu thì ăn vừa thôi!","ko":"아, 밥 좀 많이 먹어\n아유, 많이 먹을게요\n[주인] 에이그, 넌 작작 먹고","en":"You should eat more. We will indeed. You should be eating less!","text":"Ăn nhiều vào. Bọn cháu sẽ ăn nhiều. Cậu thì ăn vừa thôi!\n아, 밥 좀 많이 먹어\n아유, 많이 먹을게요\n[주인] 에이그, 넌 작작 먹고\nYou should eat more. We will indeed. You should be eating less!","sourceUid":"merged-mrdbjvay-167","sourceNo":453,"viRanges":[{"start":1582.370467,"end":1587.649696}],"koRanges":[{"start":1582.406226,"end":1587.595886}]},{"id":268,"readerNo":269,"displayNo":457,"n":457,"kind":"sub","type":"merged","vi":"Bác ấy hơi nặng lời nhỉ.\nNhưng cô ăn đi.\nĐồ ăn thì ngon lắm.\nNhưng mà…\nsao tự dưng anh lại hẹn gặp tôi?","ko":"조금 사나우세요\n[재훈] 드셔 보세요 음식 맛은 안 사나우니까\n[아인] 근데\n갑자기 절 보자고 하신 이유가…","en":"She's a bit blunt.\nBut the food is great.\nGo ahead and eat.\nBut…\nwhy did you ask me to meet you?","text":"Bác ấy hơi nặng lời nhỉ.\nNhưng cô ăn đi.\nĐồ ăn thì ngon lắm.\nNhưng mà…\nsao tự dưng anh lại hẹn gặp tôi?\n조금 사나우세요\n[재훈] 드셔 보세요 음식 맛은 안 사나우니까\n[아인] 근데\n갑자기 절 보자고 하신 이유가…\nShe's a bit blunt.\nBut the food is great.\nGo ahead and eat.\nBut…\nwhy did you ask me to meet you?","sourceUid":"merged-mrdbkts6-168","sourceNo":457,"viRanges":[{"start":1587.649696,"end":1601.279825}],"koRanges":[{"start":1587.595886,"end":1601.383969}]},{"id":269,"readerNo":270,"displayNo":461,"n":461,"kind":"sub","type":"merged","vi":"Giám đốc Choi Chang Su…\nAnh ấy đã tìm đến công ty tôi.\nGiám đốc Choi sao?","ko":"아\n최창수 상무님?\n그분이 회사로 찾아오셨더라고요\n최 상무님이요?","en":"Managing Director Choi Chang-su\ncame to my office.\nHe did?","text":"Giám đốc Choi Chang Su…\nAnh ấy đã tìm đến công ty tôi.\nGiám đốc Choi sao?\n아\n최창수 상무님?\n그분이 회사로 찾아오셨더라고요\n최 상무님이요?\nManaging Director Choi Chang-su\ncame to my office.\nHe did?","sourceUid":"merged-mrdblz9w-169","sourceNo":461,"viRanges":[{"start":1601.279825,"end":1609.826247}],"koRanges":[{"start":1601.383969,"end":1609.80174}]},{"id":270,"readerNo":271,"displayNo":"N75","n":"N75","kind":"narration","type":"narration","vi":"S#23 Một giờ trước, công ty game/văn phòng đại diện (ban ngày)","ko":"S#23 한 시간 전, 게임회사/대표실(낮)","en":"S#23 An hour ago, game company/representative office (daytime)","text":"S#23 Một giờ trước, công ty game/văn phòng đại diện (ban ngày)\nS#23 한 시간 전, 게임회사/대표실(낮)\nS#23 An hour ago, game company/representative office (daytime)","sourceUid":"nar-mrf3akvw-hwth7h","sourceNo":"N75","viRanges":[],"koRanges":[]},{"id":271,"readerNo":272,"displayNo":"N76","n":"N76","kind":"narration","type":"narration","vi":"Jeong-Jae-hoon Choi-Chang-Soo Đang nói chuyện.","ko":"재훈과 최상무 대화 중이다.","en":"Game company representative (Jeong-Jae-hoon) Choi-Chang-Soo Talking.","text":"Jeong-Jae-hoon Choi-Chang-Soo Đang nói chuyện.\n재훈과 최상무 대화 중이다.\nGame company representative (Jeong-Jae-hoon) Choi-Chang-Soo Talking.","sourceUid":"nar-mrf3an4t-zdpl3w","sourceNo":"N76","viRanges":[],"koRanges":[]},{"id":272,"readerNo":273,"displayNo":462,"n":462,"kind":"sub","type":"ko","vi":"[Âm nhạc ý nghĩa]","ko":"[의미심장한 음악]","en":"[Meaningful music]","text":"[Âm nhạc ý nghĩa]\n[의미심장한 음악]\n[Meaningful music]","sourceUid":"ko-mrc6q93o-1418","sourceNo":462,"viRanges":[],"koRanges":[]},{"id":273,"readerNo":274,"displayNo":"466","n":"466","kind":"sub","type":"merged","vi":"Anh muốn chúng tôi giảm lượng quảng cáo sao? Đúng vậy.\nCác trận đấu thể thao lớn sắp diễn ra nên sự chú ý của người xem sẽ bị thu hút vào đó.","ko":"[재훈] 광고 물량을 줄이라고요?\n[창수] 예, 그렇습니다\n큰 스포츠 경기들도 있고 해서\n이럴 땐 사람들의 관심이 다른 곳으로 가서","en":"You want me to reduce our ads? Yes.\nBig sports games are coming up, so that will draw most of the attention.","text":"Anh muốn chúng tôi giảm lượng quảng cáo sao? Đúng vậy.\nCác trận đấu thể thao lớn sắp diễn ra nên sự chú ý của người xem sẽ bị thu hút vào đó.\n[재훈] 광고 물량을 줄이라고요?\n[창수] 예, 그렇습니다\n큰 스포츠 경기들도 있고 해서\n이럴 땐 사람들의 관심이 다른 곳으로 가서\nYou want me to reduce our ads? Yes.\nBig sports games are coming up, so that will draw most of the attention.","sourceUid":"merged-mrdbn59u-171","sourceNo":466,"viRanges":[{"start":1609.826247,"end":1623.639239}],"koRanges":[{"start":1609.80174,"end":1623.539265}]},{"id":274,"readerNo":275,"displayNo":471,"n":471,"kind":"sub","type":"merged","vi":"Hiệu quả quảng cáo sẽ không cao.\nÀ…\nRa vậy.\nTôi khuyên các anh nên giảm đầu tư\nvào hoạt động tiếp thị trong năm nay.","ko":"광고 효과가 평소보다 떨어집니다\n아…\n네\n올해는 마케팅 쪽 투자\n줄이시는 걸 제안드립니다","en":"It will dramatically reduce the ad effect.\nRight.\nI see.\nI recommend that you reduce\nyour investment in marketing this year.","text":"Hiệu quả quảng cáo sẽ không cao.\nÀ…\nRa vậy.\nTôi khuyên các anh nên giảm đầu tư\nvào hoạt động tiếp thị trong năm nay.\n광고 효과가 평소보다 떨어집니다\n아…\n네\n올해는 마케팅 쪽 투자\n줄이시는 걸 제안드립니다\nIt will dramatically reduce the ad effect.\nRight.\nI see.\nI recommend that you reduce\nyour investment in marketing this year.","sourceUid":"merged-mrdbp1nv-174","sourceNo":471,"viRanges":[{"start":1623.639239,"end":1634.757005}],"koRanges":[{"start":1623.539265,"end":1634.600671}]},{"id":275,"readerNo":276,"displayNo":476,"n":476,"kind":"sub","type":"merged","vi":"Thế nên tôi gọi cho cô ngay lập tức.\nTôi nghĩ đã xảy ra chuyện gì đó.\nTôi xin lỗi\nvì để chuyện nội bộ làm phiền đến anh.\nTôi lại mừng đấy.","ko":"[재훈] 그래서 바로 상무님한테 전화드렸죠\n뭔 일 있구나 싶어서\n죄송합니다\n회사 내부 일로 귀찮게 해 드려서\n저야 좋죠","en":"So I called you as soon as he left.\nI thought something was up.\nMy apologies\nfor bothering you with our company issues.\nI'm actually glad.","text":"Thế nên tôi gọi cho cô ngay lập tức.\nTôi nghĩ đã xảy ra chuyện gì đó.\nTôi xin lỗi\nvì để chuyện nội bộ làm phiền đến anh.\nTôi lại mừng đấy.\n[재훈] 그래서 바로 상무님한테 전화드렸죠\n뭔 일 있구나 싶어서\n죄송합니다\n회사 내부 일로 귀찮게 해 드려서\n저야 좋죠\nSo I called you as soon as he left.\nI thought something was up.\nMy apologies\nfor bothering you with our company issues.\nI'm actually glad.","sourceUid":"merged-mrdbr1za-177","sourceNo":476,"viRanges":[{"start":1634.757005,"end":1652.866431}],"koRanges":[{"start":1634.600671,"end":1652.597319}]},{"id":276,"readerNo":277,"displayNo":"N77","n":"N77","kind":"narration","type":"narration","vi":"S#24 Nhà Baekban (ban ngày)","ko":"S#24 백반집(낮)","en":"S#24 Baekban House (daytime)","text":"S#24 Nhà Baekban (ban ngày)\nS#24 백반집(낮)\nS#24 Baekban House (daytime)","sourceUid":"nar-mrf3i029-1e1cmq","sourceNo":"N77","viRanges":[],"koRanges":[]},{"id":277,"readerNo":278,"displayNo":"N78","n":"N78","kind":"narration","type":"dialogue","vi":"Jeong-Jae-hoon: Thế là tôi gọi ngay cho giám đốc điều hành.","ko":"재훈:   그래서 바로 상무님한테 전화드렸죠.","en":"Game company representative (Jeong-Jae-hoon): So I called the managing director right away.","text":"Jeong-Jae-hoon: Thế là tôi gọi ngay cho giám đốc điều hành.\n재훈:   그래서 바로 상무님한테 전화드렸죠.\nGame company representative (Jeong-Jae-hoon): So I called the managing director right away.","sourceUid":"nar-mrf3i2s8-adyibg","sourceNo":"N78","viRanges":[],"koRanges":[]},{"id":278,"readerNo":279,"displayNo":477,"n":477,"kind":"sub","type":"merged","vi":"Vì nhờ có chuyện đó mà tôi mới được dùng bữa cùng cô.","ko":"아, 그 덕에 상무님이랑 같이 밥도 먹고","en":"Thanks to that, I get to have a meal with you.","text":"Vì nhờ có chuyện đó mà tôi mới được dùng bữa cùng cô.\n아, 그 덕에 상무님이랑 같이 밥도 먹고\nThanks to that, I get to have a meal with you.","sourceUid":"merged-mrdbrvoi-178","sourceNo":477,"viRanges":[{"start":1652.866431,"end":1657.603318}],"koRanges":[{"start":1652.597319,"end":1657.418378}]},{"id":279,"readerNo":280,"displayNo":479,"n":479,"kind":"sub","type":"merged","vi":"Vậy anh đã làm thế nào?\nTôi nghe nói người trong ngành của cô coi khách hàng như thượng đế.","ko":"근데 어떻게 아셨어요?\n그쪽에선 광고주를 광고주님, 신이라고 부른다면서요","en":"So what did you do?\nI heard the people in your field refer to your clients as gods.","text":"Vậy anh đã làm thế nào?\nTôi nghe nói người trong ngành của cô coi khách hàng như thượng đế.\n근데 어떻게 아셨어요?\n그쪽에선 광고주를 광고주님, 신이라고 부른다면서요\nSo what did you do?\nI heard the people in your field refer to your clients as gods.","sourceUid":"merged-mrdbsea2-179","sourceNo":479,"viRanges":[{"start":1657.603318,"end":1665.687815}],"koRanges":[{"start":1657.418378,"end":1666.48577}]},{"id":280,"readerNo":281,"displayNo":"482","n":"482","kind":"sub","type":"merged","vi":"Đúng vậy. Có con dân nào lại đến hỏi xin thượng đế ngừng phân phát đồ ăn cho mình chứ?","ko":"그렇죠\n신한테 찾아와서 일용할 양식을 끊어 달라고 하는 어린양이\n어디 있습니까?","en":"Right. No believer would come to a god and ask him to stop providing for him. It's ridiculous.","text":"Đúng vậy. Có con dân nào lại đến hỏi xin thượng đế ngừng phân phát đồ ăn cho mình chứ?\n그렇죠\n신한테 찾아와서 일용할 양식을 끊어 달라고 하는 어린양이\n어디 있습니까?\nRight. No believer would come to a god and ask him to stop providing for him. It's ridiculous.","sourceUid":"merged-mrdbtkyl-182","sourceNo":482,"viRanges":[{"start":1665.687815,"end":1674.707291}],"koRanges":[{"start":1666.48577,"end":1673.785543}]},{"id":281,"readerNo":282,"displayNo":"484","n":"484","kind":"sub","type":"merged","vi":"Những hành động khác với lẽ thường thì đều có lý do cả.","ko":"상식에서 벗어난 언행엔\n다 이유가 있는 법이죠","en":"There's always a reason behind unorthodox behaviors.","text":"Những hành động khác với lẽ thường thì đều có lý do cả.\n상식에서 벗어난 언행엔\n다 이유가 있는 법이죠\nThere's always a reason behind unorthodox behaviors.","sourceUid":"merged-mrdbuyck-183","sourceNo":484,"viRanges":[{"start":1674.707291,"end":1680.844093}],"koRanges":[{"start":1673.785543,"end":1680.50772}]},{"id":282,"readerNo":283,"displayNo":"487","n":"487","kind":"sub","type":"merged","vi":"Cảm ơn anh. Thông tin của tôi có ích chứ? Vâng, anh đã giúp tôi…","ko":"감사합니다\n제가 도움이 좀 됐나요?\n- 네, 큰 도움… - [휴대전화 진동음]","en":"Thank you. Did I help in any way? Yes, you were of big--","text":"Cảm ơn anh. Thông tin của tôi có ích chứ? Vâng, anh đã giúp tôi…\n감사합니다\n제가 도움이 좀 됐나요?\n- 네, 큰 도움… - [휴대전화 진동음]\nThank you. Did I help in any way? Yes, you were of big--","sourceUid":"merged-mrdbvp0w-184","sourceNo":487,"viRanges":[{"start":1680.844093,"end":168 em.","text":"Cô đang ở đâu? Tôi có hẹn ăn trưa bên ngoài. Cô mau về đi. Lớn chuyện rồi.\n[병수] 어디세요? 점심 약속 있어서 밖에 나왔어\n- [긴장되는 음악] - 빨리 들어오세요, 큰일 났어요\nWhere are you? I'm out for lunch. Hurry back. There's a problem.","sourceUid":"merged-mrdbxtls-187","sourceNo":492,"viRanges":[{"start":1693.220347,"end":1704.816113}],"koRanges":[{"start":1692.82645,"end":1704.854387}]},{"id":288,"readerNo":289,"displayNo":444,"n":444,"kind":"sub","type":"merged","vi":"- Ký vào đây nhé. - Họ nổi dậy rồi.","ko":"- [차 부장] 여기 사인 좀 해 줘 - 들고일어났습니다","en":"-Sign this. -They're protesting.","text":"- Ký vào đây nhé. - Họ nổi dậy rồi.\n- [차 부장] 여기 사인 좀 해 줘 - 들고일어났습니다\n-Sign this. -They're protesting.","sourceUid":"merged-mrdbytpm-188","sourceNo":444,"viRanges":[{"start":1704.816113,"end":1714.19699}],"koRanges":[{"start":1704.854387,"end":1713.89291}]},{"id":289,"readerNo":290,"displayNo":495,"n":495,"kind":"sub","type":"merged","vi":"Anh tưởng chúng tôi sẽ để yên à?\nCó vẻ là ý đồ của các đội phó bị cô thuyên chuyển.","ko":"[차 부장] 우리가 이대로 가만히 있을 거 같아?\n인사이동받은 부장들이 주도한 거 같은데","en":"You think we won't fight back?\nI think the managers you transferred are behind this.","text":"Anh tưởng chúng tôi sẽ để yên à?\nCó vẻ là ý đồ của các đội phó bị cô thuyên chuyển.\n[차 부장] 우리가 이대로 가만히 있을 거 같아?\n인사이동받은 부장들이 주도한 거 같은데\nYou think we won't fight back?\nI think the managers you transferred are behind this.","sourceUid":"merged-mrdbzgm4-189","sourceNo":495,"viRanges":[{"start":1714.19699,"end":1720.115176}],"koRanges":[{"start":1713.89291,"end":1719.732159}]},{"id":290,"readerNo":291,"displayNo":497,"n":497,"kind":"sub","type":"merged","vi":"Các nhân viên khác thì sao?\nHọ đều dè chừng Giám đốc Choi nên ký cả rồi.","ko":"[아인] 다른 직원들은? [병수] 최 상무님 눈치 보느라고 다들 사인한 거 같습니다","en":"What about the others?\nThey signed the petition as they were afraid of Mr. Choi.","text":"Các nhân viên khác thì sao?\nHọ đều dè chừng Giám đốc Choi nên ký cả rồi.\n[아인] 다른 직원들은? [병수] 최 상무님 눈치 보느라고 다들 사인한 거 같습니다\nWhat about the others? :"narration","vi":"Khi tôi đang bước đi nhanh chóng, tôi thấy mọi người đang tụ tập lại.","ko":"급하게 걸어가다가 모여있는 사람들이 보이자","en":"As I was walking quickly, I saw people gathered together.","text":"Khi tôi đang bước đi nhanh chóng, tôi thấy mọi người đang tụ tập lại.\n급하게 걸어가다가 모여있는 사람들이 보이자\nAs I was walking quickly, I saw people gathered together.","sourceUid":"nar-mrf3nzng-po2ga5","sourceNo":"N85","viRanges":[],"koRanges":[]},{"id":296,"readerNo":297,"displayNo":"N86","n":"N86","kind":"narration","type":"narration","vi":"Go-A-In bước chậm lại và tỏ ra thoải mái.","ko":"발걸음 속도를 줄이고 짐짓 여유 있는 표정을 짓는 아인.","en":"Go-A-In slows down his steps and puts on a relaxed expression.","text":"Go-A-In bước chậm lại và tỏ ra thoải mái.\n발걸음 속도를 줄이고 짐짓 여유 있는 표정을 짓는 아인.\nGo-A-In slows down his steps and puts on a relaxed expression.","sourceUid":"nar-mrf3o0jj-fnbej4","sourceNo":"N86","viRanges":[],"koRanges":[]},{"id":297,"readerNo":298,"displayNo":"N87","n":"N87","kind":"narration","type":"dialogue","vi":"Han-Byeong-Su: (E) Choi-Chang-Soo Tôi nghĩ tôi đã ký nó để thu hút sự chú ý của mọi người.","ko":"병수:   (E) 최상무님 눈치 보느라 싸인들 한거 같습니다.","en":"Manager Han (Han-Byeong-Su): (E) Choi-Chang-Soo I think I signed it to get people's attention.","text":"Han-Byeong-Su: (E) Choi-Chang-Soo Tôi nghĩ tôi đã ký nó để thu hút sự chú ý của mọi người.\n병수:   (E) 최상무님 눈치 보느라 싸인들 한거 같습니다.\nManager Han (Han-Byeong-Su): (E) Choi-Chang-Soo I think I signed it to get people's attention.","sourceUid":"nar-mrf3opxz-feq9sv","sourceNo":"N87","viRanges":[],"koRanges":[]},{"id":298,"readerNo":299,"displayNo":"N88","n":"N88","kind":"narration","type":"narration","vi":"Go-A-In Hãy tiếp cận anh ấy một cách nhàn nhã. Kwon-Woo-Cheol Anh ấy mỉm cười như thể đang chờ đợi.","ko":"아인이 여유롭게 다가가자 권씨디가 기다렸다는 듯 미소 건 네며.","en":"Go-A-In Let's approach him leisurely. Kwon-Woo-Cheol He smiles as if he's been waiting.","text":"Go-A-In Hãy tiếp cận anh ấy một cách nhàn nhã. Kwon-Woo-Cheol Anh ấy mỉm cười như thể đang chờ đợi.\n아인이 여 art":1780,"end":1786.516481}]},{"id":305,"readerNo":306,"displayNo":506,"n":506,"kind":"sub","type":"merged","vi":"Họ đang thực hiện quyền lợi chính đáng.\nCô tưởng nhân sự cấp cao là thánh à?\nĐược phép tự ý đánh giá nhân sự ư?","ko":"정당한 인사권 행사지 - [어두운 음악] - 임원이 무슨 신인 줄 알아? 멋대로 인사 평가를 해 버리고","en":"They're exercising their rightful power.\nAn executive isn't a god.\nYou can't evaluate their performance as you like.","text":"Họ đang thực hiện quyền lợi chính đáng.\nCô tưởng nhân sự cấp cao là thánh à?\nĐược phép tự ý đánh giá nhân sự ư?\n정당한 인사권 행사지 - [어두운 음악] - 임원이 무슨 신인 줄 알아? 멋대로 인사 평가를 해 버리고\nThey're exercising their rightful power.\nAn executive isn't a god.\nYou can't evaluate their performance as you like.","sourceUid":"merged-mrdc6bwd-197","sourceNo":506,"viRanges":[{"start":1794,"end":1803.696779}],"koRanges":[{"start":1794,"end":1803.907565}]},{"id":306,"readerNo":307,"displayNo":509,"n":509,"kind":"sub","type":"merged","vi":"Chắc họ phải bất an lắm nên mới làm thế này.\nPhải không?\n- Đúng ạ. - Vâng.","ko":"직원들이 얼마나 불안하면 이러겠어\n안 그래?\n- [부장1] 그렇죠, 뭐 - [부장2] 네","en":"They were so anxious that they signed it. Right? -Yes, sir. -Yes.","text":"Chắc họ phải bất an lắm nên mới làm thế này.\nPhải không?\n- Đúng ạ. - Vâng.\n직원들이 얼마나 불안하면 이러겠어\n안 그래?\n- [부장1] 그렇죠, 뭐 - [부장2] 네\nThey were so anxious that they signed it. Right? -Yes, sir. -Yes.","sourceUid":"merged-mrdc7woq-198","sourceNo":509,"viRanges":[{"start":1803.696779,"end":1810.394016}],"koRanges":[{"start":1803.907565,"end":1811.456968}]},{"id":307,"readerNo":308,"displayNo":512,"n":512,"kind":"sub","type":"merged","vi":"Xem ra cô chỉ hợp làm quản lý sáng tạo thôi.\nTôi giao phó cho cô vị trí quá sức rồi chăng?","ko":"그릇이 딱 CD 그릇인가?\n[창수] 내가 너무 큰 자리를 맡긴 거야?","en":"I guess you weren't worthy of an executive.\nHave I given you too much to handle?","text":"Xem ra cô chỉ hợp làm quản lý sáng tạo thôi.\nTôi giao phó cho cô vị trí quá sức rồi chăng?\n그릇이 딱 CD 그릇인가?\n[창수] 내가 너무 큰 자리를 맡긴 거야?\nI guess you weren't wort anges":[]},{"id":312,"readerNo":313,"displayNo":"522","n":"522","kind":"sub","type":"merged","vi":"Lá bài của tôi thế nào? Giờ cô mới thấy thời gian một năm quả là đáng giá, phải không?","ko":"어때? 내 카드가?\n[창수] 이제 와서 보니까 1년도 엄청 귀하게 느껴지지?","en":"How do you like my move? Now that you think about it, one year seems generous, right?","text":"Lá bài của tôi thế nào? Giờ cô mới thấy thời gian một năm quả là đáng giá, phải không?\n어때? 내 카드가?\n[창수] 이제 와서 보니까 1년도 엄청 귀하게 느껴지지?\nHow do you like my move? Now that you think about it, one year seems generous, right?","sourceUid":"merged-mrdci3xw-204","sourceNo":522,"viRanges":[{"start":1895,"end":1902.777347}],"koRanges":[{"start":1895,"end":1903.518821}]},{"id":313,"readerNo":314,"displayNo":"525","n":"525","kind":"sub","type":"merged","vi":"Tiếc quá. Sửa sang lại phòng giám đốc sáng tạo tốn kém chẳng ít.","ko":"씁, 어휴, 아깝다\n제작 본부장실 새로 인테리어 하느라\n돈 꽤 들었는데","en":"What a shame. Renovating your office was quite expensive.","text":"Tiếc quá. Sửa sang lại phòng giám đốc sáng tạo tốn kém chẳng ít.\n씁, 어휴, 아깝다\n제작 본부장실 새로 인테리어 하느라\n돈 꽤 들었는데\nWhat a shame. Renovating your office was quite expensive.","sourceUid":"merged-mrdcif28-205","sourceNo":525,"viRanges":[{"start":1902.777347,"end":1913.802196}],"koRanges":[{"start":1903.518821,"end":1912.925805}]},{"id":314,"readerNo":315,"displayNo":526,"n":526,"kind":"sub","type":"ko","vi":"[Trường Tô cười]","ko":"[창수의 헛웃음]","en":"[Changsu laughs]","text":"[Trường Tô cười]\n[창수의 헛웃음]\n[Changsu laughs]","sourceUid":"ko-mrc6q93o-1482","sourceNo":526,"viRanges":[],"koRanges":[]},{"id":315,"readerNo":316,"displayNo":"N93","n":"N93","kind":"narration","type":"narration","vi":"Choi-Chang-Soo đi, Go-A-In, cố gắng đừng thể hiện cảm xúc của mình nhiều nhất có thể.","ko":"최상무가 가고, 아인, 최대한 감정을 드러내지 않으려고 노력한다.","en":"Choi-Chang-Soo go, Go-A-In, try not to show your emotions as much as possible.","text":"Choi-Chang-Soo đi, Go-A-In, cố gắng đừng thể hiện cảm xúc của mình nhiều nhất có thể.\n최상무가 가고, 아인, 최대한 감정을  Anh chưa xem à?\nVậy tôi sẽ phải mang súng theo.\n- Tôi là thư ký kiêm vệ sĩ mà. - Đây có phải Mỹ đâu…\nmà làm vậy.","ko":"[한나] 인기 엄청 많던데? 안 봤어?\n그럼 저는 총 차고 다녀야겠네요? 비서 겸 보디가드니까\n아, 그건 미국이…","en":"It's super popular. You haven't seen it?\nThen I'll need a gun.\n-I'm your secretary and bodyguard. -We're not in the…\nStates.","text":"Phim đó nổi lắm. Anh chưa xem à?\nVậy tôi sẽ phải mang súng theo.\n- Tôi là thư ký kiêm vệ sĩ mà. - Đây có phải Mỹ đâu…\nmà làm vậy.\n[한나] 인기 엄청 많던데? 안 봤어?\n그럼 저는 총 차고 다녀야겠네요? 비서 겸 보디가드니까\n아, 그건 미국이…\nIt's super popular. You haven't seen it?\nThen I'll need a gun.\n-I'm your secretary and bodyguard. -We're not in the…\nStates.","sourceUid":"merged-mrdl0en3-265","sourceNo":631,"viRanges":[{"start":2361.25,"end":2370.281717}],"koRanges":[{"start":2361.471967,"end":2369.242939}]},{"id":389,"readerNo":390,"displayNo":634,"n":634,"kind":"sub","type":"merged","vi":"Trời ạ. Tôi chưa đi làm bao giờ, làm sao biết được nên mặc gì.\nĐợi đó.\nĐể tôi thử bộ khác.","ko":"[한나] 고\n아씨, 회사를 다녀 봤어야 회사 복장을 알지\n기다려, 다른 거 입어 볼게","en":"Darn it. I've never worked, so I don't know how to dress up.\nWait.\nI'll try on something else.","text":"Trời ạ. Tôi chưa đi làm bao giờ, làm sao biết được nên mặc gì.\nĐợi đó.\nĐể tôi thử bộ khác.\n[한나] 고\n아씨, 회사를 다녀 봤어야 회사 복장을 알지\n기다려, 다른 거 입어 볼게\nDarn it. I've never worked, so I don't know how to dress up.\nWait.\nI'll try on something else.","sourceUid":"merged-mrdl1n1y-267","sourceNo":634,"viRanges":[{"start":2370.281717,"end":2379.881313}],"koRanges":[{"start":2369.242939,"end":2379.783804}]},{"id":390,"readerNo":391,"displayNo":636,"n":636,"kind":"sub","type":"merged","vi":"Quản lý, cho tôi xem mấy bộ\ncho dân công sở đi.\nMau lên.","ko":"그, 매니저 회사원들이 입는 옷 있죠?\n그런 걸로 좀 보여 줘 봐요, 얼른","en":"Manager, show me the clothes\noffice workers wear.\nQuickly.","text":"Quản lý, cho tôi xem mấy bộ\ncho dân công sở đi.\nMau lên.\n그, 매니저 회사원들이 입는 옷 있죠?\n그런 걸로 좀 보여 줘 봐요, 얼른\nManager, show me the clothes\noffice workers wear.\nQuickly.","s ô ta là người thế nào? Sáng nắng chiều mưa. Bên ngoài trông có vẻ ngây thơ,\nnhưng bên trong xảo quyệt vô cùng.\nDù vậy cũng chỉ là tân binh.\nTôi sẽ mềm mỏng với cô ta.","ko":"어떤 타입이야? [태완] 기분파야 - [어두운 음악] - 겉으론 헤헤거려도\n속엔 능구렁이 몇 마리 있고\n그래 봐야 뭐, 신입이지\n내가 잘 우쭈쭈할게","en":"What kind of person is she?\nA whimsical type.\nAlthough she may seem naive,\nthey say she's a fox inside.\nShe's still just a rookie.\nI'll take care of her.","text":"Cô ta là người thế nào? Sáng nắng chiều mưa. Bên ngoài trông có vẻ ngây thơ,\nnhưng bên trong xảo quyệt vô cùng.\nDù vậy cũng chỉ là tân binh.\nTôi sẽ mềm mỏng với cô ta.\n어떤 타입이야? [태완] 기분파야 - [어두운 음악] - 겉으론 헤헤거려도\n속엔 능구렁이 몇 마리 있고\n그래 봐야 뭐, 신입이지\n내가 잘 우쭈쭈할게\nWhat kind of person is she?\nA whimsical type.\nAlthough she may seem naive,\nthey say she's a fox inside.\nShe's still just a rookie.\nI'll take care of her.","sourceUid":"merged-mrdnl0ns-319","sourceNo":730,"viRanges":[{"start":2675.750757,"end":2688.188009}],"koRanges":[{"start":2676.22474,"end":2688.243969}]},{"id":451,"readerNo":452,"displayNo":734,"n":734,"kind":"sub","type":"merged","vi":"Đừng xem thường Kang Han Na chỉ vì cô ta tỏ ra dễ gần.\nCô ta khó nắm bắt lắm.\nY hệt chủ tịch Wang.\nHơn cả anh trai cô ta sao?","ko":"[태완] 강한나 겉으로 실실거린다고 쉽게 보지 마\n보통 아니다\n왕회장 미니미야\n오빠 잡아먹을 정도?","en":"Don't take her lightly because she's easygoing on the outside.\nShe's hard to handle.\nShe's just like her grandfather.\nIs she worse than her brother?","text":"Đừng xem thường Kang Han Na chỉ vì cô ta tỏ ra dễ gần.\nCô ta khó nắm bắt lắm.\nY hệt chủ tịch Wang.\nHơn cả anh trai cô ta sao?\n[태완] 강한나 겉으로 실실거린다고 쉽게 보지 마\n보통 아니다\n왕회장 미니미야\n오빠 잡아먹을 정도?\nDon't take her lightly because she's easygoing on the outside.\nShe's hard to handle.\nShe's just like her grandfather.\nIs she worse than her brother?","sourceUid":"merged-mrdnmgcp-321","sourceNo":734,"viRanges":[{"start":2688.188,"end":2697.766259},{"start":2688.188009,"end":2692.057053}],"koRanges":[{"start":2688.243969,"end":2697.282554},{"start":2688.243969,"end":2692.092874}]},{"id":452,"readerNo":453,"displayNo":674,"n":674,"kind":"sub","type":"merged","vi":"Nếu vậy…\nnhắn cô ta 1:00 chiều mai hãy đến làm.\nSao lại thế?\nTôi muốn tạo ấn tượng tốt.\nPhải chào đón cô ta thật nồng nhiệt.","ko":"그럼\n내일 오후 1시쯤 출근하시라고 전해 줘\n왜?\n현대 사회에는 보험이 필수 아닌가?\n성대하게 환영해 드려야지","en":"Then…\ntell her to come to work around 1 p.m. tomorrow.\nWhy?\nI want to make a good impression.\nWe should give her a warm welcome.","text":"Nếu vậy…\nnhắn cô ta 1:00 chiều mai hãy đến làm.\nSao lại thế?\nTôi muốn tạo ấn tượng tốt.\nPhải chào đón cô ta thật nồng nhiệt.\n그럼\n내일 오후 1시쯤 출근하시라고 전해 줘\n왜?\n현대 사회에는 보험이 필수 아닌가?\n성대하게 환영해 드려야지\nThen…\ntell her to come to work around 1 p.m. tomorrow.\nWhy?\nI want to make a good impression.\nWe should give her a warm welcome.","sourceUid":"merged-mrdnoapq-323","sourceNo":674,"viRanges":[{"start":2697.766259,"end":2711.47474}],"koRanges":[{"start":2697.282554,"end":2712.03303}]},{"id":453,"readerNo":454,"displayNo":"N141","n":"N141","kind":"narration","type":"narration","vi":"Đại lý S#36/Phòng Go-A-In (Ban đêm)","ko":"S#36 대행사/아인 방(밤)","en":"S#36 Agency/Go-A-In Room (Night)","text":"Đại lý S#36/Phòng Go-A-In (Ban đêm)\nS#36 대행사/아인 방(밤)\nS#36 Agency/Go-A-In Room (Night)","sourceUid":"nar-mrftzfyl-rz416v","sourceNo":"N141","viRanges":[],"koRanges":[]},{"id":454,"readerNo":455,"displayNo":"N142","n":"N142","kind":"narration","type":"narration","vi":"Một đội sản xuất trống rỗng, tắt đèn. Đèn chỉ hiển thị trong phòng Go-A-In và phòng Go-A-In. Khi tôi ngừng gõ và thấy màn hình Go-A-In gật đầu như thể không sao, tôi đã viết email. Tại địa chỉ đính kèm là danh sách hàng chục người (00 điện tử, 00 giám đốc, 00 quản lý, v.v.). Go-A-In nhìn chằm chằm vào nút gửi email một lúc lâu.","ko":"불이 꺼진 텅 빈 제작팀. 아인 방에서만 불빛이 보이고, 아인 방. 타자를 멈추고는 됐다는 듯 고개를 끄덕이는 아인 모니터가 보이면 메일을 썼는데. 첨부된 주소에 수십 명의 명단 (00 전자 00 이사, 00부장 등) 메일 보내기 버튼을 한참이나 바라보고 있는 아인.","en":"An empty production team with the lights off. The light is only visible in en others do.","sourceUid":"merged-mrdo5bh7-341","sourceNo":772,"viRanges":[{"start":2856.936916,"end":2863.934849}],"koRanges":[{"start":2857.435027,"end":2863.617359}]},{"id":474,"readerNo":475,"displayNo":774,"n":774,"kind":"sub","type":"merged","vi":"Nên mặc bộ nào đây?","ko":"[한나] 이 중에 뭐 입을까?\n[영우] 어…","en":"What should I wear?","text":"Nên mặc bộ nào đây?\n[한나] 이 중에 뭐 입을까?\n[영우] 어…\nWhat should I wear?","sourceUid":"merged-mrdo5xzo-342","sourceNo":774,"viRanges":[{"start":2863.934849,"end":2867.882241}],"koRanges":[{"start":2863.617359,"end":2868.627064}]},{"id":475,"readerNo":476,"displayNo":777,"n":777,"kind":"sub","type":"merged","vi":"Cô muốn mặc bộ nào?\nTôi á?\nĐồ tôi muốn mặc không có ở đây.","ko":"뭐 입고 싶으신데요?\n나?\n내가 입고 싶은 건 여기 없지","en":"What do you want to wear?\nMe?\nThey're not here.","text":"Cô muốn mặc bộ nào?\nTôi á?\nĐồ tôi muốn mặc không có ở đây.\n뭐 입고 싶으신데요?\n나?\n내가 입고 싶은 건 여기 없지\nWhat do you want to wear?\nMe?\nThey're not here.","sourceUid":"merged-mrdo6yyy-344","sourceNo":777,"viRanges":[{"start":2872,"end":2879.032097}],"koRanges":[{"start":2872,"end":2879.627518}]},{"id":476,"readerNo":477,"displayNo":778,"n":778,"kind":"sub","type":"merged","vi":"Vậy chúng ở đâu?","ko":"그럼 어디 있는데요?","en":"Then where are they?","text":"Vậy chúng ở đâu?\n그럼 어디 있는데요?\nThen where are they?","sourceUid":"merged-mrdo7vwx-345","sourceNo":778,"viRanges":[{"start":2879.032097,"end":2881.493432}],"koRanges":[{"start":2879.627518,"end":2881.699899}]},{"id":477,"readerNo":478,"displayNo":779,"n":779,"kind":"sub","type":"ko","vi":"[Âm nhạc thú vị]","ko":"[흥미로운 음악]","en":"[Interesting music]","text":"[Âm nhạc thú vị]\n[흥미로운 음악]\n[Interesting music]","sourceUid":"ko-mrc6q93p-1735","sourceNo":779,"viRanges":[],"koRanges":[]},{"id":478,"readerNo":479,"displayNo":781,"n":781,"kind":"sub","type":"merged","vi":"Đây.\nHôm nay là ngày đầu đi làm, tôi muốn bước vào thật lộng lẫy.","ko":"[한나] 여기\n아, 첫 출근 날은 인상을 팍 심어 주게","en":"Here.\nI want to make an entrance since it's my first day.","text":"Đây.\nHôm nay là ngày đầu đi làm, tôi muốn bước vào thật lộng lẫy.\n[한나] 여기\n아, 첫 출근 날은 인상을 팍 심어 주게\nHere.\nI want to make an entrance since it's my first day.","sourceUid":"merged-mrdo8j63-346","sourceNo":781,"viRanges":[{"start":2890,"end":2897.222733}],"koRanges":[{"start":2890,"end":2897.389751}]},{"id":479,"readerNo":480,"displayNo":"785","n":"785","kind":"sub","type":"merged","vi":"Tôi muốn mặc bộ này, hoặc là…\nbộ này cũng được, để mọi người nhớ đến tôi, và không bao giờ quên.\nVậy mặc bộ đó đi.","ko":"이런 거 아니면\n아, 이런 거 입어서 뇌리에 그냥 딱!\n[한숨] 박아 둬야 되는데, 쯧\n그럼 그거 입으세요","en":"I want to wear something like this or…\nsomething like this, so everyone will remember me and never forget.\nThen wear that.","text":"Tôi muốn mặc bộ này, hoặc là…\nbộ này cũng được, để mọi người nhớ đến tôi, và không bao giờ quên.\nVậy mặc bộ đó đi.\n이런 거 아니면\n아, 이런 거 입어서 뇌리에 그냥 딱!\n[한숨] 박아 둬야 되는데, 쯧\n그럼 그거 입으세요\nI want to wear something like this or…\nsomething like this, so everyone will remember me and never forget.\nThen wear that.","sourceUid":"merged-mrdoc0gt-348","sourceNo":785,"viRanges":[{"start":2897.222733,"end":2908.342201}],"koRanges":[{"start":2897.389751,"end":2908.609563}]},{"id":480,"readerNo":481,"displayNo":786,"n":786,"kind":"sub","type":"merged","vi":"Anh nói tôi phải mặc kiểu công sở mà.","ko":"회사원답게 입어야 한다며","en":"You said I should dress appropriately.","text":"Anh nói tôi phải mặc kiểu công sở mà.\n회사원답게 입어야 한다며\nYou said I should dress appropriately.","sourceUid":"merged-mrdocw7h-349","sourceNo":786,"viRanges":[{"start":2908.342201,"end":2911.659752}],"koRanges":[{"start":2908.609563,"end":2911.470364}]},{"id":481,"readerNo":482,"displayNo":"789","n":"789","kind":"sub","type":"merged","vi":"Giám đốc Kang. Tôi á?\nTừ hôm nay, cô là giám đốc mà.","ko":"상무님\n나? 오늘부턴 상무잖아요","en":"Managing Director Kang. Me? Starting today, you are a managing director.","text":"Giám đốc Kang. Tôi á?\nTừ hôm nay, cô là giám đốc mà.\n상무님\n나? 오늘부턴 상무잖아요\nManaging Director Kang. Me? Starting today, you are a managing director.","sourceUid":"merged-mrdodhbt-350","sourceNo":789,"viRanges":[{"start":2911.659752,"end":2919.470364}],"koRanges":[{"start":2911.470364,"end":2919.858587}]},{"id":482,"readerNo":483,"displayNo":"791","n":"791","kind":"sub","type":"merged","vi":"Cũng phải. Giám đốc Kang. Cô đẹp nhất khi là chính mình.\nCô có thể bắt chước thất bại, nhưng không thể bắt chước thành công đâu.","ko":"[한나가 멋쩍게 웃으며] 그러네? [영우] 상무님은 상무님다울 때가 제일 보기 좋아요\n실패는 복사할 수 있어도 성공은 복사할 수 없는 법이니까","en":"You're right. Managing Director Kang.\nYou look the best when you are yourself.\nYou can imitate mistakes, but you can't imitate success.","text":"Cũng phải. Giám đốc Kang. Cô đẹp nhất khi là chính mình.\nCô có thể bắt chước thất bại, nhưng không thể bắt chước thành công đâu.\n[한나가 멋쩍게 웃으며] 그러네? [영우] 상무님은 상무님다울 때가 제일 보기 좋아요\n실패는 복사할 수 있어도 성공은 복사할 수 없는 법이니까\nYou're right. Managing Director Kang.\nYou look the best when you are yourself.\nYou can imitate mistakes, but you can't imitate success.","sourceUid":"merged-mrdofxat-352","sourceNo":791,"viRanges":[{"start":2919.470364,"end":2930.982758},{"start":2919.470364,"end":2928.207027}],"koRanges":[{"start":2919.858587,"end":2931.712373}]},{"id":483,"readerNo":484,"displayNo":"795","n":"795","kind":"sub","type":"merged","vi":"Nên hãy cứ là mình. Hãy bắt đầu theo cách đó đi. Vậy nhé?","ko":"- [흥미로운 음악] - 강한나답게\n시작부터 그렇게 가시죠\n그럴까?","en":"So be yourself. That's how you should begin. Should I?","text":"Nên hãy cứ là mình. Hãy bắt đầu theo cách đó đi. Vậy nhé?\n- [흥미로운 음악] - 강한나답게\n시작부터 그렇게 가시죠\n그럴까?\nSo be yourself. That's how you should begin. Should I?","sourceUid":"merged-mrdogiqp-353","sourceNo":795,"viRanges":[{"start":2930.982758,"end":2937.602789}],"koRanges":[{"start":2931.712373,"end":2937.871466}]},{"id":484,"readerNo":485,"displayNo":"N146","n":"N146","kind":"narration","type":"narration","vi":"S#39 Nhà Han-Na/phòng Kang-Geun-Cheol buổi sáng]","ko":"S#39 한나 집/왕회장 방아침]","en":"S#39 Han-Na house/Chairma cấp cao?\n씁, 야\n너래 오늘 첫 출근이라고 하지 않았어?\n[한나] 응, 그래서 신경 좀 썼어\n[근철] 긴데 임원들 입는 그런 옷 와 안 입었니?\nDidn't you say it's your first day at work today?\nIt is. That's why I put in some effort.\nBut why didn't you dress up like an executive?","sourceUid":"merged-mrdoj41i-356","sourceNo":802,"viRanges":[{"start":2947.562565,"end":2958.037678}],"koRanges":[{"start":2947.881331,"end":2958.516991}]},{"id":488,"readerNo":489,"displayNo":803,"n":803,"kind":"sub","type":"merged","vi":"Sao cháu lại phải mặc như nô bộc?","ko":"내가 왜 머슴들 옷을 입어?","en":"Why would I dress like a servant?","text":"Sao cháu lại phải mặc như nô bộc?\n내가 왜 머슴들 옷을 입어?\nWhy would I dress like a servant?","sourceUid":"merged-mrdojqu0-357","sourceNo":803,"viRanges":[{"start":2958.037678,"end":2960.70368}],"koRanges":[{"start":2958.516991,"end":2961.047981}]},{"id":489,"readerNo":490,"displayNo":"742","n":"742","kind":"sub","type":"merged","vi":"Dù thất bại đi nữa, cháu vẫn muốn là mình.\nMới ngày đầu mà cháu tiêu cực vậy!\nCháu giống ông mà. Cháu sẽ không thất bại. Còn lâu nhé. - Ông à. - Sao?\nDù ông có mệt, cũng đừng vội mất mà hãy đợi cháu.","ko":"나답게 하려고 죽이 되든 밥이 되든\n[근철] 야, 첫날부터 말이 그게 뭐이가!\n넌 나 닮아서 죽 될 일 없어야 고럼, 응\n- 할아버지 - [근철] 응\n힘들어도 죽지 말고 조금만 기다려","en":"Whether I fail or not, I'm going to be myself.\nDon't be so negative on your first day! You take after me.\nYou'll never fail. Never. -Grandpa. -Yes? I know it's tough, but don't die just yet.","text":"Dù thất bại đi nữa, cháu vẫn muốn là mình.\nMới ngày đầu mà cháu tiêu cực vậy!\nCháu giống ông mà. Cháu sẽ không thất bại. Còn lâu nhé. - Ông à. - Sao?\nDù ông có mệt, cũng đừng vội mất mà hãy đợi cháu.\n나답게 하려고 죽이 되든 밥이 되든\n[근철] 야, 첫날부터 말이 그게 뭐이가!\n넌 나 닮아서 죽 될 일 없어야 고럼, 응\n- 할아버지 - [근철] 응\n힘들어도 죽지 말고 조금만 기다려\nWhether I fail or not, I'm going to be myself.\nDon't be so negative on your first day! You take after me.\nYou'll never fail. Never. -Grandpa. -Yes? I know it's tough, but don't die just yet.","sourceUid":"merged-mrdolho8-360","sourceNo":742,"viRanges":[ ile. I come into the locker room whistling, look at my phone to see if I have any contact, then put it in the locker and go to the shower.","text":"Chào mọi người bằng nụ cười nhẹ nhàng. Tôi vào phòng thay đồ huýt sáo, nhìn điện thoại xem có liên lạc gì không rồi cất vào tủ rồi đi tắm.\n사람들과 젠틀한 미소로 인사. 락커룸으로 휘파람 불면서 들어와서 연락 온 거 있나 핸드폰 한 번 보고는 락커에 넣고 샤워하러 간다.\nGreet people with a gentle smile. I come into the locker room whistling, look at my phone to see if I have any contact, then put it in the locker and go to the shower.","sourceUid":"nar-mrfukqq5-p3bsj1","sourceNo":"N150","viRanges":[],"koRanges":[]},{"id":501,"readerNo":502,"displayNo":824,"n":824,"kind":"sub","type":"merged","vi":"[Những bản nhạc sôi động]\n[Trường Tô ậm ừ]\n[Khóa âm thanh vận hành]","ko":"[신나는 음악이 흘러나온다]\n[창수가 흥얼거린다]\n[잠금장치 작동음]","en":"[Exciting music plays]\n[Changsu hums]\n[Lock operating sound]","text":"[Những bản nhạc sôi động]\n[Trường Tô ậm ừ]\n[Khóa âm thanh vận hành]\n[신나는 음악이 흘러나온다]\n[창수가 흥얼거린다]\n[잠금장치 작동음]\n[Exciting music plays]\n[Changsu hums]\n[Lock operating sound]","sourceUid":"merged-mrdosqt4-369","sourceNo":824,"viRanges":[],"koRanges":[]},{"id":502,"readerNo":503,"displayNo":826,"n":826,"kind":"sub","type":"merged","vi":"Lâu lắm rồi mới được yên ổn như vậy.","ko":"오랜만에 평화롭네, 어?","en":"It hasn't been this peaceful in a while.","text":"Lâu lắm rồi mới được yên ổn như vậy.\n오랜만에 평화롭네, 어?\nIt hasn't been this peaceful in a while.","sourceUid":"merged-mrdot4yt-370","sourceNo":826,"viRanges":[{"start":3040,"end":3042.356912}],"koRanges":[{"start":3040,"end":3042.501562}]},{"id":503,"readerNo":504,"displayNo":"N151","n":"N151","kind":"narration","type":"narration","vi":"Ngay khi tôi vừa nói “bình yên”, chiếc điện thoại Choi-Chang-Soo mà tôi cất trong tủ bắt đầu đổ chuông. Nếu nó cúp máy, cuộc gọi sẽ quay lại. Nếu nó cúp máy, cuộc gọi sẽ quay lại.","ko":"평화롭다는 말이 끝나기 무섭게 락커에 넣어둔 최상무 전화 가 울리기 시작. 끊기면 다시 전화 끊기면 다시 전화가 온다.","en":"As soon as I finished saying “peace,” the phone Choi-Ch ,"sourceUid":"nar-mrfuq2g9-heabyx","sourceNo":"N161","viRanges":[],"koRanges":[]},{"id":524,"readerNo":525,"displayNo":"N162","n":"N162","kind":"narration","type":"narration","vi":"S#45 Montage, đại lý + đường phố + xe buýt + thang máy, v.v. (buổi sáng)","ko":"S#45 몽타주, 대행사 + 길거리 + 버스 + 엘리베이터 등등 (아침)","en":"S#45 Montage, agency + street + bus + elevator etc. (morning)","text":"S#45 Montage, đại lý + đường phố + xe buýt + thang máy, v.v. (buổi sáng)\nS#45 몽타주, 대행사 + 길거리 + 버스 + 엘리베이터 등등 (아침)\nS#45 Montage, agency + street + bus + elevator etc. (morning)","sourceUid":"nar-mrfurj5a-uzi7c0","sourceNo":"N162","viRanges":[],"koRanges":[]},{"id":525,"readerNo":526,"displayNo":"N163","n":"N163","kind":"narration","type":"narration","vi":"Nhân viên tụ tập đây đó nói chuyện. Chúng tôi gửi email cho nhau qua KakaoTalk và trò chuyện.","ko":"여기저기 모여서 웅성거리고 있는 직원들. 서로 카톡으로 메일 전달하며 웅성거린다.","en":"Employees gathered here and there talking. We send emails to each other via KakaoTalk and chatter.","text":"Nhân viên tụ tập đây đó nói chuyện. Chúng tôi gửi email cho nhau qua KakaoTalk và trò chuyện.\n여기저기 모여서 웅성거리고 있는 직원들. 서로 카톡으로 메일 전달하며 웅성거린다.\nEmployees gathered here and there talking. We send emails to each other via KakaoTalk and chatter.","sourceUid":"nar-mrfurkce-5w76jp","sourceNo":"N163","viRanges":[],"koRanges":[]},{"id":526,"readerNo":527,"displayNo":860,"n":860,"kind":"sub","type":"merged","vi":"Cô xem mail chưa?\nLà thật sao?\nChị ấy thực sự đã gửi thư như vậy cho khách hàng sao?","ko":"[직원1] 메일 봤어?\n[직원2] 진짜야?\n정말 광고주한테 그렇게 메일 보낸 거야?","en":"Did you read the email?\nIs it true?\nDid she really send out that email to the clients?","text":"Cô xem mail chưa?\nLà thật sao?\nChị ấy thực sự đã gửi thư như vậy cho khách hàng sao?\n[직원1] 메일 봤어?\n[직원2] 진짜야?\n정말 광고주한테 그렇게 메일 보낸 거야?\nDid you read the email?\nIs it true?\nDid she really send out that email to the clients?","sourceUid":"merged-mrejvrzq-1","sourceNo":860,"viRanges":[{"start":3162,"end":3169.782006}],"koRanges":[{"start":3162,"end":3169.581315}]},{"id":527,"readerNo":528,"displayNo":863,"n":863,"kind":"sub","type":"merged","vi":"Có chuyện gì vậy? Tôi đang đến công ty đây.\nXem này.","ko":"[직원3] 무슨 일인데요?\n저 지금 출근 중인데\n[직원4] 봐 봐","en":"What happened? I'm going to work right now.\nLook at this.","text":"Có chuyện gì vậy? Tôi đang đến công ty đây.\nXem này.\n[직원3] 무슨 일인데요?\n저 지금 출근 중인데\n[직원4] 봐 봐\nWhat happened? I'm going to work right now.\nLook at this.","sourceUid":"merged-mrejz1fw-3","sourceNo":863,"viRanges":[{"start":3169.782006,"end":3174.227846}],"koRanges":[{"start":3169.581315,"end":3175.180227}]},{"id":528,"readerNo":529,"displayNo":"865","n":"865","kind":"sub","type":"merged","vi":"- Đâu, cho tôi xem. - Này, xem chưa? Đỉnh vậy.\n- Không tin nổi. - Thật sao? NHÌN NÀY","ko":"- [직원5가 놀라며] 야, 대박 - [직원6] 뭐, 뭐? - [직원7] 야, 야, 대박 - [직원8] 와, 진짜?","en":"-Hey, let me see. -Did you see? No way.\n-No way. -Really? LOOK AT THIS","text":"- Đâu, cho tôi xem. - Này, xem chưa? Đỉnh vậy.\n- Không tin nổi. - Thật sao? NHÌN NÀY\n- [직원5가 놀라며] 야, 대박 - [직원6] 뭐, 뭐? - [직원7] 야, 야, 대박 - [직원8] 와, 진짜?\n-Hey, let me see. -Did you see? No way.\n-No way. -Really? LOOK AT THIS","sourceUid":"merged-mrek32g2-8","sourceNo":865,"viRanges":[{"start":3174.227846,"end":3188.404}],"koRanges":[{"start":3175.180227,"end":3188.403528}]},{"id":529,"readerNo":530,"displayNo":866,"n":866,"kind":"sub","type":"merged","vi":"Từ nay Truyền thông VC sẽ từ chối hai kiểu công việc.","ko":"[아인] 금일부로 VC기획은 두 가지의 업무는 거절합니다","en":"Moving forward, VC Communications will refuse two types of work.","text":"Từ nay Truyền thông VC sẽ từ chối hai kiểu công việc.\n[아인] 금일부로 VC기획은 두 가지의 업무는 거절합니다\nMoving forward, VC Communications will refuse two types of work.","sourceUid":"merged-mrek41sh-9","sourceNo":866,"viRanges":[{"start":3188.404,"end":3192.758294}],"koRanges":[{"start":3188.403528,"end":3193.691873}]},{"id":530,"readerNo":531,"displayNo":869,"n":869,"kind":"sub","type":"merged","vi":"Thứ nhất,\ntừ chối các yêu cầu đưa ra vào thứ Sáu nhưng hạn nộp là thứ Hai.\nLâu rồi mới được về đúng giờ, làm gì đây?","ko":"[아인] 첫째\n금요일 업무 지시 후 월요일까지 제출 요구 거부\n[직원1] 오랜만에 칼퇴하는 불금인데 뭐 할 거야?","en":"First,\nwe'll refuse requests sent on a Friday for Monday deadlines.\nAny plans? It's been a while since we got off work on time.","text":"Thứ nhất,\ntừ chối các yêu cầu đưa ra vào thứ Sáu nhưng hạn nộp là thứ Hai.\nLâu rồi mới được về đúng giờ, làm gì đây?\n[아인] 첫째\n금요일 업무 지시 후 월요일까지 제출 요구 거부\n[직원1] 오랜만에 칼퇴하는 불금인데 뭐 할 거야?\nFirst,\nwe'll refuse requests sent on a Friday for Monday deadlines.\nAny plans? It's been a while since we got off work on time.","sourceUid":"merged-mrek5b6d-11","sourceNo":869,"viRanges":[{"start":3192.758294,"end":3200.5}],"koRanges":[{"start":3193.691873,"end":3201.5}]},{"id":531,"readerNo":532,"displayNo":"N164","n":"N164","kind":"narration","type":"narration","vi":"S#46 Quá Khứ. Đội sản xuất đại lý + văn phòng quảng cáo (ban ngày)","ko":"S#46 과거. 대행사 제작팀 + 광고주 사무실(낮)","en":"S#46 Past. Agency production team + advertiser office (daytime)","text":"S#46 Quá Khứ. Đội sản xuất đại lý + văn phòng quảng cáo (ban ngày)\nS#46 과거. 대행사 제작팀 + 광고주 사무실(낮)\nS#46 Past. Agency production team + advertiser office (daytime)","sourceUid":"nar-mrfusqly-wb4qs7","sourceNo":"N164","viRanges":[],"koRanges":[]},{"id":532,"readerNo":533,"displayNo":"N165","n":"N165","kind":"narration","type":"dialogue","vi":"Thứ Sáu 5 giờ 50 chiều. Các thành viên trong nhóm sản xuất chuẩn bị tan làm.","ko":"금요일 오후 5시 50분. 퇴근 준비하는 제작팀원들.","en":"Friday 5:50 PM. Production team members preparing to leave work.","text":"Thứ Sáu 5 giờ 50 chiều. Các thành viên trong nhóm sản xuất chuẩn bị tan làm.\n금요일 오후 5시 50분. 퇴근 준비하는 제작팀원들.\nFriday 5:50 PM. Production team members preparing to leave work.","sourceUid":"nar-mrfussr5-tpruma","sourceNo":"N165","viRanges":[],"koRanges":[]},{"id":533,"readerNo":534,"displayNo":872,"n":872,"kind":"sub","type":"merged","vi":"Tôi phải ngủ bù. Còn anh?\nTôi…\nVâng, thưa anh.","ko":"[직원2] 잠이나 자야죠 차장님은요?\n- 씁, 나는 -
